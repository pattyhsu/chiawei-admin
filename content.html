<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家偉補習班 · 內容行銷台</title>
<!-- 內容行銷台 — hand-written (unlike receipt.html, which is GENERATED by
     chiawei/scripts/build_receipt.py; do not confuse the two).

     Load order is load-bearing: auth.js hides <body> at parse time and this
     page's init() must not run until authGate() reaches a verdict.

     This page shows REAL DATA, including student names on a 榜單 — which the
     other pages here do not. The client-side gate is NOT what protects it:
     every read and write goes to Supabase under the anon key, and RLS
     (owner/admin only) is the boundary. Same posture as backstage. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>window.PAGE_ROLES = ["owner", "admin"];</script>
<script src="auth.js"></script>
<style>
:root {
  /* Brand palette (chiawei CLAUDE.md): 寶藍 primary, 黃/橘 accents.
     Copied per-page, matching login.html — this repo has no shared stylesheet. */
  --brand: #2547c7;
  --brand-yellow: #f8c414;
  --brand-orange: #ef5226;
  --bg: #f6f7fb;
  --surface: #fff;
  --ink: #1b1f2a;
  --muted: #6b7280;
  --line: #e3e6ee;
  --danger: #c0362c;
  --ok: #1e7d46;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: "PingFang TC", "Noto Sans TC", system-ui, -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 2px solid var(--brand);
  position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
}
header .brand { font-weight: 700; color: var(--brand); }
header .spacer { flex: 1; }
header .who { font-size: 13px; color: var(--muted); }
main {
  max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px;
  display: grid; grid-template-columns: 228px 1fr; gap: 26px; align-items: start;
}
/* Left menu — one entry per category, because the categories ARE the work:
   每個主題自己一格存貨、自己一個輪值日。The old three tabs hid that behind a
   single 文案庫 list you had to scan by chip colour. */
.side { position: sticky; top: 58px; }
.side .grp {
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: .08em; margin: 18px 0 5px; padding: 0 10px;
}
.side .grp:first-child { margin-top: 0; }
.side a {
  display: flex; align-items: baseline; gap: 8px; padding: 7px 10px;
  border-radius: 8px; color: var(--ink); text-decoration: none;
  font-size: 13px; font-weight: 600;
}
.side a:hover { background: #eef1fc; }
.side a.on { background: var(--brand); color: #fff; }
.side a .dow { font-size: 11px; font-weight: 600; color: var(--muted); }
.side a.on .dow { color: #ccd6f6; }
.side a .n {
  margin-left: auto; font-size: 11px; font-weight: 800;
  border-radius: 999px; padding: 1px 7px; background: #eef1fc; color: var(--brand);
}
.side a .n.zero { background: #fdeae3; color: var(--danger); }
.side a.on .n { background: rgba(255, 255, 255, .22); color: #fff; }
.pane { min-width: 0; }
h2 { font-size: 20px; margin: 0 0 4px; }
.muted { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.6; }
button, .btn {
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--brand); color: #fff; padding: 7px 13px;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn.ghost, button.ghost { background: #fff; color: var(--ink); }
.btn.ok, button.ok { background: var(--ok); border-color: var(--ok); }
.btn.warn, button.warn { background: var(--brand-orange); border-color: var(--brand-orange); }
.btn.danger, button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
.chip {
  display: inline-block; font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 3px 9px; background: #eef1fc; color: var(--brand);
}
.chip.draft { background: #f1f2f5; color: var(--muted); }
.chip.approved { background: #e5f4ea; color: var(--ok); }
.chip.posted { background: var(--brand); color: #fff; }
.chip.rejected, .chip.err { background: #fdeae3; color: var(--danger); }
.chip.sample { background: #fef6da; color: #8a6a00; }
.chip.consent { background: #e5f4ea; color: var(--ok); }
.day { margin-top: 26px; }
.day h3 {
  font-size: 14px; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0;
}
.day h3 .today {
  margin-left: 8px; font-size: 11px; color: #fff;
  background: var(--brand-orange); border-radius: 999px; padding: 2px 7px;
}
.item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.thumb {
  width: 132px; height: 132px; flex: 0 0 132px; object-fit: cover;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.thumb.pending {
  display: grid; place-items: center; font-size: 12px; color: var(--muted);
  text-align: center; padding: 8px; line-height: 1.5;
}
.body { flex: 1; min-width: 0; }
.meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.meta b { font-size: 15px; }
.err {
  color: var(--danger); font-size: 12px; margin: 6px 0 0;
  background: #fdeae3; border-radius: 6px; padding: 6px 9px; line-height: 1.5;
}
textarea, input[type=text], input[type=date], input[type=number], select {
  font: inherit; font-size: 13px; width: 100%;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
  background: #fff; color: var(--ink);
}
textarea { resize: vertical; margin-top: 8px; line-height: 1.6; }
.acts { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
.card {
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  padding: 13px 15px; margin-top: 12px;
}
.card.used { opacity: .6; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
label.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
label.fld.grow { flex: 1; min-width: 140px; }
.consent {
  border: 1px solid var(--brand-yellow); background: #fef6da55;
  border-radius: 10px; padding: 12px 14px; display: flex;
  flex-direction: column; gap: 10px;
}
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.chk input { width: auto; }
/* 一週輪值 strip — the drumbeat, with each day's 文案庫 stock underneath, so a
   silent day is visible BEFORE it happens rather than as a gap in the queue. */
.rota { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 0 0 20px; }
.rota .d {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 8px 9px; min-width: 0;
}
.rota a.d { text-decoration: none; color: inherit; }
.rota a.d:hover { border-color: var(--brand); }
.rota .d.today { border-color: var(--brand); box-shadow: 0 0 0 2px #eef1fc; }
.rota .d.rest { background: #fafbfd; }
.rota .dow { font-size: 11px; font-weight: 700; color: var(--muted); }
.rota .d.today .dow { color: var(--brand); }
.rota .cat { font-size: 13px; font-weight: 700; margin-top: 2px; line-height: 1.35; }
.rota .src { display: block; font-size: 11px; margin-top: 5px; color: var(--muted); }
.rota .src.out { color: var(--danger); font-weight: 700; }
.rota .src.manual { color: var(--brand-orange); font-weight: 700; }
.hide { display: none !important; }
.empty { color: var(--muted); font-size: 14px; margin-top: 30px; line-height: 1.7; }
/* Narrow: the menu becomes a horizontal scroller above the pane rather than
   eating half the screen. Group labels stay as inline dividers. */
@media (max-width: 780px) {
  main { grid-template-columns: 1fr; gap: 14px; }
  .side {
    position: static; display: flex; align-items: center; gap: 6px;
    overflow-x: auto; padding: 0 0 8px;
  }
  .side .grp {
    margin: 0; padding: 0 4px 0 10px; white-space: nowrap;
    border-left: 1px solid var(--line);
  }
  .side .grp:first-child { border-left: 0; padding-left: 0; }
  .side a { white-space: nowrap; border: 1px solid var(--line); padding: 6px 10px; }
  .side a .n { margin-left: 6px; }
}
@media (max-width: 640px) {
  .rota { grid-template-columns: repeat(4, 1fr); }
  .item { flex-direction: column; }
  .thumb, .thumb.pending { width: 100%; height: auto; aspect-ratio: 1; flex: none; }
}
</style>
</head>
<body>
<header>
  <span class="brand">家偉補習班 · 內容行銷台</span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <a class="btn ghost" href="index.html">後台首頁</a>
  <button type="button" class="ghost" id="btn-signout">登出</button>
</header>

<main>
<aside class="side" id="side"></aside>
<div class="pane">
  <!-- ── 佇列 ─────────────────────────────────────────────────────────── -->
  <section id="tab-queue">
    <h2>佇列</h2>
    <p class="muted">
      每天早上自動產生的貼文草稿會出現在這裡。預覽 → 改文案 → 核准 → 下載圖片、
      複製文案 → 貼到 FB / IG / LINE → 回來按「標記已發布」。
    </p>
    <div class="rota" id="rota"></div>
    <div id="queue"></div>
  </section>

  <!-- ── 文案庫（單一主題）─────────────────────────────────────────────── -->
  <section id="tab-bank" class="hide">
    <h2 id="bank-title"></h2>
    <p class="muted" id="bank-lede"></p>
    <div id="bank-alert"></div>
    <div id="bank"></div>
  </section>

  <!-- ── 新貼文（單一類型）─────────────────────────────────────────────── -->
  <section id="tab-new" class="hide">
    <h2 id="new-title"></h2>
    <p class="muted" id="new-lede"></p>
    <div id="compose"></div>
  </section>
</div>
</main>

<script>
// ── constants ───────────────────────────────────────────────────────────────
const BUCKET = "content-cards";
// Key order is the 新貼文 dropdown order, so the composable types are grouped:
// 招生／公告 first (what gets made most often), then the 真實學生 ones, then media.
const TYPE_LABEL = {
  tip: "學習技巧", exam_info: "會考情報", quiz: "本週一題",
  parent_tip: "家長小提醒", pep: "雞湯",
  offering: "開課資訊", notice: "公告", event: "活動", teacher: "老師介紹",
  honor_roll: "榜單", testimonial_parent: "家長見證",
  testimonial_student: "學生見證", leap_card: "躍升卡",
  weekly: "這週@家偉", image_post: "圖片貼文",
};
const STATUS_LABEL = { draft: "草稿", approved: "已核准", posted: "已發布", rejected: "已退回" };
// The five evergreen pillars — written ahead in 文案庫, popped by the morning
// schedule. Mirrors content_bank_kind_check (migration 20260821000001).
const BANK_KIND = {
  tip: "學習技巧", exam_info: "會考情報", quiz: "本週一題",
  parent_tip: "家長小提醒", pep: "雞湯",
};
const BANK_STATUS = { draft: "待審核", reviewed: "已審核", used: "已使用" };

// ── 一週輪值 ────────────────────────────────────────────────────────────────
// The drumbeat, and the ONLY place this page states it. Must stay in lockstep
// with PILLARS in chiawei/web/scripts/content/generate-daily.ts — that map is
// what actually runs; this one is what Patty sees.
//   kind   → 排程自動從文案庫挑一則（沒存貨就跳過那天）
//   manual → 沒人建就不會有（這週@家偉 要照片，排程畫不出來）
const ROTATION = [
  { dow: 1, day: "一", kind: "tip" },
  { dow: 2, day: "二", kind: "exam_info" },
  { dow: 3, day: "三", kind: "quiz" },
  { dow: 4, day: "四", kind: "parent_tip" },
  { dow: 5, day: "五", manual: "weekly" },
  { dow: 6, day: "六", rest: true },
  { dow: 0, day: "日", kind: "pep" },
];
/** 週一／四 … — which days a bank kind can ship on ("" = not in the rotation). */
const shipsOn = (kind) =>
  ROTATION.filter((r) => r.kind === kind).map((r) => `週${r.day}`).join("／");

// Types whose picture IS the post: the row is inserted with image_keys already
// set, so the render trigger never fires and no card is drawn. weekly joins
// image_post here — 這週@家偉 is a photo of the week, not a rendered template.
const UPLOAD_TYPES = ["image_post", "weekly"];
// 個資法 gate — mirrors the content_consent_required CHECK constraint. The DB is
// the real enforcement; this only decides whether the UI shows the consent block.
// image_post and weekly are here because an uploaded photo may have real
// students in it — 開課資訊/公告/老師介紹 carry course and staff data only.
const PII_TYPES = ["honor_roll", "testimonial_parent", "testimonial_student",
  "leap_card", "image_post", "weekly"];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayTaipei = () =>
  new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());

/** Weekday (0=Sun) of today in Asia/Taipei — never the browser's timezone. */
const todayDow = () => {
  const [y, m, d] = todayTaipei().split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
};

/** "2026-09-02" → "9/2（三）" — how a date reads on a card, not ISO. */
function twDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${m}/${d}（${"日一二三四五六"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}）`;
}

let ITEMS = [], BANK = [], POLL = null;

/** The 一週輪值 strip. Each day shows its pillar and how much reviewed stock is
 *  left for it — a day with none posts NOTHING, and that has to be visible here
 *  rather than discovered as a hole in the queue a week later. */
function renderRotation() {
  const dow = todayDow();
  const stock = (k) => BANK.filter((b) => b.kind === k && b.status === "reviewed").length;
  document.getElementById("rota").innerHTML = ROTATION.map((r) => {
    let cat, src;
    if (r.kind) {
      const n = stock(r.kind);
      cat = BANK_KIND[r.kind];
      src = n
        ? `<span class="src">存貨 ${n} 則</span>`
        : `<span class="src out">缺稿 · 不發</span>`;
    } else if (r.manual) {
      cat = TYPE_LABEL[r.manual];
      src = `<span class="src manual">手動建立</span>`;
    } else {
      cat = "—";
      src = `<span class="src">休息</span>`;
    }
    // A day with a pillar links to that pillar's stock — the strip is where you
    // notice 缺稿, so it should also be where you can go fix it.
    const inner = `<span class="dow">週${r.day}${r.dow === dow ? " · 今天" : ""}</span>
      <div class="cat">${esc(cat)}</div>${src}`;
    const cls = `d${r.dow === dow ? " today" : ""}${r.rest ? " rest" : ""}`;
    return r.kind
      ? `<a class="${cls}" href="#bank/${r.kind}">${inner}</a>`
      : r.manual
        ? `<a class="${cls}" href="#new/${r.manual}">${inner}</a>`
        : `<div class="${cls}">${inner}</div>`;
  }).join("");
}

// ── 左側選單 + routing ──────────────────────────────────────────────────────
// One view at a time, addressed by hash so a reload (or a bookmark, or the back
// button) lands where you were:
//   #queue · #bank/<kind> · #new/<type>
// Anything unrecognised falls back to the queue rather than showing a blank pane.
function parseHash() {
  const [head, arg] = (location.hash.replace(/^#/, "") || "queue").split("/");
  if (head === "bank" && BANK_KIND[arg]) return { view: "bank", arg };
  if (head === "new" && FORMS[arg]) return { view: "new", arg };
  return { view: "queue" };
}

const reviewedOf = (k) => BANK.filter((b) => b.kind === k && b.status === "reviewed").length;
const draftsOf = (k) => BANK.filter((b) => b.kind === k && b.status === "draft").length;

function renderSide() {
  const cur = parseHash();
  const link = (href, on, inner) =>
    `<a href="#${href}"${on ? ' class="on"' : ""}>${inner}</a>`;
  const dayOf = (k) => (ROTATION.find((r) => r.kind === k) || {}).day;
  const todo = ITEMS.filter((i) => i.status === "draft").length;
  document.getElementById("side").innerHTML = `
    <div class="grp">佇列</div>
    ${link("queue", cur.view === "queue",
      `<span>待處理草稿</span>${todo ? `<span class="n">${todo}</span>` : ""}`)}
    <div class="grp">文案庫 · 自動輪值</div>
    ${Object.keys(BANK_KIND).map((k) => {
      const n = reviewedOf(k);
      return link(`bank/${k}`, cur.view === "bank" && cur.arg === k,
        `<span>${esc(BANK_KIND[k])}</span><span class="dow">週${dayOf(k) || "—"}</span>` +
        `<span class="n${n ? "" : " zero"}">${n}</span>`);
    }).join("")}
    <div class="grp">新貼文 · 手動</div>
    ${Object.keys(TYPE_LABEL).filter((t) => FORMS[t]).map((t) =>
      link(`new/${t}`, cur.view === "new" && cur.arg === t,
        `<span>${esc(TYPE_LABEL[t])}</span>`)).join("")}`;
}

function route() {
  const cur = parseHash();
  renderSide();
  for (const v of ["queue", "bank", "new"]) {
    document.getElementById("tab-" + v).classList.toggle("hide", v !== cur.view);
  }
  if (cur.view === "bank") renderBank(cur.arg);
  if (cur.view === "new") renderCompose(cur.arg);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ── 佇列 ────────────────────────────────────────────────────────────────────
async function loadQueue() {
  const { data, error } = await window.sb
    .from("content_items")
    .select("*")
    .order("scheduled_date", { ascending: false })
    .order("created_at", { ascending: true });
  if (error) { document.getElementById("queue").innerHTML =
    `<p class="empty">讀取失敗：${esc(error.message)}</p>`; return; }
  ITEMS = data || [];
  renderSide();
  await renderQueue();
}

async function renderQueue() {
  const el = document.getElementById("queue");
  if (!ITEMS.length) {
    el.innerHTML = `<p class="empty">目前沒有貼文草稿。<br>
      排程每天早上照上面那排輪值，從文案庫挑一則做成卡片（需要有「已審核」存貨）；
      或到「新貼文」手動建立。</p>`;
    return;
  }
  const today = todayTaipei();
  const days = [...new Set(ITEMS.map((i) => i.scheduled_date))];
  el.innerHTML = days.map((d) => `
    <section class="day">
      <h3>${esc(d)}${d === today ? '<span class="today">今天</span>' : ""}</h3>
      ${ITEMS.filter((i) => i.scheduled_date === d).map(itemHtml).join("")}
    </section>`).join("");
  await fillThumbs();
}

function itemHtml(it) {
  const pending = !it.image_keys || it.image_keys.length === 0;
  return `
  <article class="item" data-id="${it.id}">
    ${pending
      ? `<div class="thumb pending">${it.render_error ? "產圖失敗" : "卡片產生中…<br>約 2–3 分鐘"}</div>`
      : `<img class="thumb" data-path="${esc(it.image_keys[0])}" alt="${esc(it.title)}">`}
    <div class="body">
      <div class="meta">
        <span class="chip">${esc(TYPE_LABEL[it.type] || it.type)}</span>
        <span class="chip ${it.status}">${esc(STATUS_LABEL[it.status])}</span>
        ${it.sample_data ? '<span class="chip sample">示意資料</span>' : ""}
        ${it.consent_ref ? `<span class="chip consent">同意編號 ${esc(it.consent_ref)}</span>` : ""}
        <b>${esc(it.title)}</b>
      </div>
      ${it.render_error ? `<p class="err">產圖失敗：${esc(it.render_error)}</p>` : ""}
      <textarea rows="4" data-caption>${esc(it.caption)}</textarea>
      <div class="acts">
        <button class="ghost" data-act="save">儲存文案</button>
        <button class="ghost" data-act="copy">複製文案</button>
        ${pending ? "" : `<button class="ghost" data-act="download">下載圖片</button>`}
        ${it.type === "image_post" ? "" : `<button class="ghost" data-act="rerender">重新產圖</button>`}
        ${it.status === "draft" ? `<button class="ok" data-act="approve">核准</button>
          <button class="ghost" data-act="reject">退回</button>` : ""}
        ${it.status !== "posted" ? `<button class="warn" data-act="posted">標記已發布</button>` : ""}
        ${it.post_url ? `<a class="btn ghost" href="${esc(it.post_url)}" target="_blank" rel="noreferrer">查看貼文</a>` : ""}
        ${it.status !== "posted" ? `<button class="danger" data-act="delete">刪除</button>` : ""}
      </div>
    </div>
  </article>`;
}

// Cards are in a PRIVATE bucket: fetch a short-lived signed URL per image.
async function fillThumbs() {
  const imgs = [...document.querySelectorAll("img.thumb[data-path]")];
  if (!imgs.length) return;
  const { data } = await window.sb.storage.from(BUCKET)
    .createSignedUrls(imgs.map((i) => i.dataset.path), 300);
  (data || []).forEach((r, n) => { if (r.signedUrl) imgs[n].src = r.signedUrl; });
}

document.getElementById("queue").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const art = btn.closest(".item");
  const it = ITEMS.find((i) => i.id === art.dataset.id);
  const caption = art.querySelector("[data-caption]").value;
  const act = btn.dataset.act;
  btn.disabled = true;
  try {
    if (act === "copy") {
      await navigator.clipboard.writeText(caption);
      btn.textContent = "已複製 ✓";
      setTimeout(() => (btn.textContent = "複製文案"), 1500);
      return;
    }
    if (act === "download") return download(it);
    if (act === "save")     return void (await patch(it.id, { caption }));
    if (act === "approve")  return void (await patch(it.id, { status: "approved" }));
    if (act === "reject")   return void (await patch(it.id, { status: "rejected" }));
    // Clearing image_keys is what asks the server for a fresh card (a DB
    // trigger dispatches the render job) — see the migration for why.
    if (act === "rerender") return void (await patch(it.id, { image_keys: [], render_error: null }));
    if (act === "posted") {
      const url = prompt("貼文網址（可留空）") ?? "";
      return void (await patch(it.id, {
        status: "posted", posted_at: new Date().toISOString(), post_url: url.trim() || null }));
    }
    if (act === "delete") {
      if (!confirm("刪除這筆草稿？")) return;
      const { error } = await window.sb.from("content_items").delete().eq("id", it.id);
      if (error) alert("刪除失敗：" + error.message);
      return void (await loadQueue());
    }
  } finally {
    btn.disabled = false;
  }
});

async function patch(id, fields) {
  const { error } = await window.sb.from("content_items").update(fields).eq("id", id);
  if (error) { alert("儲存失敗：" + error.message); return; }
  await loadQueue();
}

async function download(it) {
  const path = it.image_keys[0];
  const { data, error } = await window.sb.storage.from(BUCKET).download(path);
  if (error) { alert("下載失敗：" + error.message); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(data);
  a.download = `${it.type}-${it.scheduled_date}.png`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function loadBank() {
  const { data, error } = await window.sb
    .from("content_bank").select("*")
    .order("status", { ascending: true }).order("created_at", { ascending: true });
  if (error) { document.getElementById("bank").innerHTML =
    `<p class="empty">讀取失敗：${esc(error.message)}</p>`; return; }
  BANK = data || [];
  renderSide();
  renderRotation();
  const cur = parseHash();
  if (cur.view === "bank") renderBank(cur.arg);
}

/** One pillar's stock. Says how long it LASTS, not just how many rows there are —
 *  a bare count never tells you the feed is about to go quiet. */
function renderBank(kind) {
  const rows = BANK.filter((b) => b.kind === kind);
  const ready = reviewedOf(kind), waiting = draftsOf(kind);
  const perWeek = ROTATION.filter((r) => r.kind === kind).length || 1;
  const wks = ready / perWeek;
  const runway = !ready
    ? '<b style="color:var(--danger)">0 則已審核 — 這個主題目前不會發文</b>'
    : `<b>${ready}</b> 則已審核（約 ${wks >= 1 ? Math.floor(wks) : "不到 1"} 週）` +
      (wks < 1 ? ' <span style="color:var(--brand-orange)">← 快用完了</span>' : "");

  document.getElementById("bank-title").textContent = BANK_KIND[kind];
  document.getElementById("bank-lede").innerHTML = `
    每${shipsOn(kind) || "（未排入輪值）"}早上，排程從這裡<b>挑一則</b>做成卡片放進佇列。
    這裡是<b>存貨</b>，不是貼文 —— 按「審核通過」只是排進待發清單。<br>
    存貨：${runway}${waiting ? ` · 另有 <b>${waiting}</b> 則待審核` : ""}。
    補存貨請在 Claude Code 跑 <code>/author-content</code>。`;

  // The failure mode this page exists to prevent: a bank full of copy nobody
  // ever approved, and a feed that quietly stopped weeks ago because of it.
  document.getElementById("bank-alert").innerHTML = (!ready && waiting)
    ? `<p class="err">有 ${waiting} 則待審核，但 <b>0 則已審核</b> ——
       ${shipsOn(kind) || "輪值日"}不會發文。逐則看過、按「審核通過」，才會排進待發清單。</p>`
    : "";

  document.getElementById("bank").innerHTML = rows.map((b) => `
    <div class="card ${b.status === "used" ? "used" : ""}" data-id="${b.id}">
      <div class="meta">
        <span class="chip ${b.status === "reviewed" ? "approved" : b.status === "used" ? "posted" : "draft"}">
          ${esc(BANK_STATUS[b.status])}</span>
      </div>
      <textarea rows="1" data-f="title">${esc(b.title)}</textarea>
      <textarea rows="3" data-f="body">${esc(b.body)}</textarea>
      <textarea rows="2" data-f="caption" placeholder="貼文文案（留空 = 自動套模板）">${esc(b.caption || "")}</textarea>
      ${b.status === "reviewed" ? `<p class="muted" style="margin:0">✓ 已排入待發清單 —— 等下一個${shipsOn(b.kind) || "輪值日"}早上排程挑到它，就會出現在佇列。</p>` : ""}
      ${b.status === "used" ? `<p class="muted" style="margin:0">已做成貼文（在佇列裡）。</p>` : ""}
      <div class="acts">
        <button class="ghost" data-act="save">儲存</button>
        ${b.status === "draft" ? `<button class="ok" data-act="review">審核通過</button>` : ""}
        ${b.status === "reviewed" ? `<button class="ghost" data-act="unreview">退回待審</button>` : ""}
        ${b.status !== "used" ? `<button class="danger" data-act="delete">刪除</button>` : ""}
      </div>
    </div>`).join("") || `<p class="empty">還沒有${esc(BANK_KIND[kind])}的存貨。<br>
      批次撰寫請在 Claude Code 跑 <code>/author-content</code>，匯入後回來審核。</p>`;
}

document.getElementById("bank").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const card = btn.closest(".card");
  const id = card.dataset.id;
  const get = (f) => card.querySelector(`[data-f="${f}"]`).value;

/** Pre-fill 開課資訊 from class_offerings — the same rows offerings.html edits,
 *  so 招生 copy can't drift from what the 官網 and 家長專區 are advertising.
 *  ⚠ That table's grants are COLUMN-SCOPED: select only columns granted there
 *  (migrations 20260806000001 + 20260820000001), or the read comes back null.
 *  Purely a convenience — any failure leaves the blank form usable. */
async function fillOfferingPicker() {
  const sel = document.getElementById("c-offering-pick");
  if (!sel || sel.dataset.filled) return;
  const { data, error } = await window.sb.from("class_offerings")
    .select("id, name, grade_label, subject, schedule, start_date, kind, signup_deadline")
    .neq("status", "closed").order("sort_order").order("name");
  if (error || !data?.length) return;
  sel.dataset.filled = "1";
  sel.insertAdjacentHTML("beforeend", data.map((o) =>
    `<option value="${o.id}">${esc(o.name)}${o.kind === "special" ? "（特別班）" : ""}</option>`).join(""));
  sel.addEventListener("change", () => {
    const o = data.find((r) => r.id === sel.value);
    if (!o) return;
    const set = (f, val) => {
      const el = document.querySelector(`[data-p="${f}"]`);
      if (el) el.value = val || "";
    };
    set("class_name", o.name);
    set("grade_label", o.grade_label);
    set("subject", o.subject);
    set("schedule", o.schedule);
    set("start_text", twDate(o.start_date));
    set("deadline_text", twDate(o.signup_deadline));
    const title = document.getElementById("c-title");
    if (!title.value.trim()) title.value = `開課 · ${o.name}`;
  });
}

    if (e.target.matches("[data-rm]")) e.target.closest(".row").remove();
  });
  document.getElementById("c-go").addEventListener("click", submit);
}

function syncConsent() {
  const pii = PII_TYPES.includes(document.getElementById("c-type").value);
  const sample = document.getElementById("c-sample").checked;
  document.getElementById("c-consent-fld").classList.toggle("hide", !pii || sample);
}

function payloadOf(t) {
  const v = (p) => (document.querySelector(`[data-p="${p}"]`)?.value || "").trim();
  if (UPLOAD_TYPES.includes(t)) return {};  // the image is the content; nothing to render
  if (t === "offering") return {
    class_name: v("class_name"), grade_label: v("grade_label") || undefined,
    subject: v("subject") || undefined, schedule: v("schedule") || undefined,
    start_text: v("start_text") || undefined, deadline_text: v("deadline_text") || undefined,
    seats: v("seats") || undefined, cta: v("cta") || undefined };
  if (t === "notice") return {
    notice_kind: v("notice_kind") || "其他", headline: v("headline"),
    body: v("body") || undefined, effective_text: v("effective_text") || undefined };
  if (t === "teacher") return {
    name: v("name"), subject: v("subject") || undefined, tagline: v("tagline") || undefined,
    // one credential per line — the card renders them as a 學經歷 list
    credentials: v("credentials").split("\n").map((c) => c.trim()).filter(Boolean),
    note: v("note") || undefined };
  if (t === "honor_roll") return {
    year_roc: v("year_roc"), headline: v("headline"), note: v("note") || undefined,
    students: [...document.querySelectorAll("[data-student]")].map((r) => ({
      name: r.querySelector('[data-s="name"]').value.trim(),
      school: r.querySelector('[data-s="school"]').value.trim(),
    })).filter((s) => s.name && s.school),
  };
  if (t === "event") return {
    event_name: v("event_name"), date_text: v("date_text"),
    place: v("place") || undefined, cta: v("cta") || undefined, body: v("body") || undefined };
  if (t.startsWith("testimonial")) return {
    quote: v("quote"), attribution: v("attribution"), context: v("context") || undefined };
  if (t === "leap_card") return {
    student: v("student"), subject: v("subject"), period: v("period") || undefined,
    before: Number(v("before")), after: Number(v("after")),
    trajectory: [...document.querySelectorAll("[data-traj]")].map((r) => ({
      label: r.querySelector('[data-t="label"]').value.trim(),
      score: Number(r.querySelector('[data-t="score"]').value),
      level: Number(r.querySelector('[data-t="level"]').value),
    })).filter((p) => p.label),
  };
}

async function submit() {
  const t = document.getElementById("c-type").value;
  const sample = document.getElementById("c-sample").checked;
  const ref = document.getElementById("c-ref")?.value.trim() || null;
  const msg = document.getElementById("c-msg");
  const go = document.getElementById("c-go");
  // Client-side hint only — the DB check constraint is the real gate, and it
  // rejects unconsented real student data even for service_role.
  if (PII_TYPES.includes(t) && !sample && !ref) {
    msg.innerHTML = '<span style="color:var(--danger)">真實學生資料需要家長書面同意編號，或勾選示意資料。</span>';
    return;
  }
  go.disabled = true;

  // An image post carries its own picture — upload it first, then insert the row
  // WITH image_keys set, so the render trigger never fires and no card is drawn.
  let imageKeys = [];
  if (UPLOAD_TYPES.includes(t)) {
    const file = document.getElementById("c-file").files[0];
    if (!file) {
      msg.innerHTML = '<span style="color:var(--danger)">請先選一張圖片。</span>';
      go.disabled = false;
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      msg.innerHTML = '<span style="color:var(--danger)">圖片太大（超過 10MB），請先壓縮。</span>';
      go.disabled = false;
      return;
    }
    msg.textContent = "上傳圖片中…";
    const ext = (file.name.split(".").pop() || "png").toLowerCase();
    const path = `content/uploads/${crypto.randomUUID()}.${ext}`;
    const up = await window.sb.storage.from(BUCKET)
      .upload(path, file, { contentType: file.type, upsert: false });
    if (up.error) {
      msg.innerHTML = `<span style="color:var(--danger)">上傳失敗：${esc(up.error.message)}</span>`;
      go.disabled = false;
      return;
    }
    imageKeys = [path];
  }

  msg.textContent = "建立中…";
  const { data, error } = await window.sb.from("content_items").insert({
    type: t,
    scheduled_date: document.getElementById("c-date").value,
    title: document.getElementById("c-title").value.trim() || TYPE_LABEL[t],
    caption: document.getElementById("c-caption").value,
    payload: payloadOf(t),
    sample_data: sample,
    consent_ref: ref,
    image_keys: imageKeys,
  }).select("id").single();
  go.disabled = false;
  if (error) {
    msg.innerHTML = `<span style="color:var(--danger)">建立失敗：${esc(error.message)}</span>`;
    return;
  }
  location.hash = "queue";                     // hashchange re-routes the pane
  await loadQueue();
  if (UPLOAD_TYPES.includes(t)) return;        // image is already there
  msg.textContent = "已建立 ✓ 卡片產生中（約 2–3 分鐘），完成後會出現在佇列。";
  pollFor(data.id);
}

// The card is rendered by GitHub Actions, so poll until the image lands.
function pollFor(id) {
  clearInterval(POLL);
  let tries = 0;
  POLL = setInterval(async () => {
    if (++tries > 40) return clearInterval(POLL);      // ~5 min then give up
    const { data } = await window.sb.from("content_items")
      .select("image_keys, render_error").eq("id", id).maybeSingle();
    if (data && (data.image_keys?.length || data.render_error)) {
      clearInterval(POLL);
      await loadQueue();
    }
  }, 8000);
}

// ── boot ────────────────────────────────────────────────────────────────────
(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;            // gate already redirected
  document.getElementById("btn-signout").addEventListener("click", window.signOut);
  document.getElementById("who").textContent =
    `${window.CURRENT_USER.email} · ${window.CURRENT_USER_ROLE}`;
  await Promise.all([loadQueue(), loadBank()]);
  route();
})();
</script>
