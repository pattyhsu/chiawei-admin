<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家偉補習班 · 學生總覽</title>
<!-- 學生總覽 — everything about ONE student on one page (Patty, 2026-08-18).

     The data already existed, spread across 名冊 / 收費台 / 餐費台 / 分析報告.
     This is the read view that pulls them together; 編輯 jumps to 名冊, so there
     is still exactly ONE place where student data is written.

     LAYOUT: scanned, not read. Identity strip → three KPI tiles (未繳 / 餐費餘額 /
     覆蓋度) → detail in columns. A manager opening a student wants "does she owe
     money, is her meal balance low, how is she doing" answered before they read
     anything, so those three are numbers at the top, colour-coded by state.

     🔑 ROLES ARE ENFORCED BY RLS, NOT BY THIS PAGE — with one exception.
     A teacher's JWT simply returns no rows for tuition_outstanding_v, meal_ledger
     or student_notes (their policies are is_owner_admin()), so those sections
     come back empty without this page deciding anything. The EXCEPTION is
     CONTACTS: students_select allows teaches_student(), so a teacher CAN read
     父母電話/LINE (verified with a real JWT). Patty's call (2026-08-18) is that
     they should not see them — contacting families is front-desk work and this is
     minors' PII, the same reason the 家長報告 PDF omits guardian contacts. That
     single hide is done here in code, and is therefore the one thing a UI bug
     could expose. It is marked at the point of use.

     ⚠️ Most 學習 tiles read empty until exams are graded: readiness_snapshots is
     empty and archetype mastery exists for a handful of students. Empty states
     say "not yet" and render "—", never 0 — a zero here would be a false claim. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>window.PAGE_ROLES = ["owner", "admin", "teacher"];</script>
<script src="auth.js"></script>
<style>
:root {
  --brand: #2547c7; --orange: #ef5226; --gold: #f8c414; --ok: #1f7a4d;
  --bg: #f6f7fb; --surface: #fff; --ink: #1b1f2a; --muted: #6b7280; --line: #e3e6ee;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55;
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 56px; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; }
.top .msg { margin-left: auto; }
a { color: var(--brand); }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--orange); font-weight: 700; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
select, input, textarea { font: inherit; padding: 6px 9px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; color: var(--ink); }
select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 7px 15px;
  background: var(--brand); color: #fff; cursor: pointer; }
button.danger { background: transparent; border: 0; color: var(--muted);
  padding: 0 4px; font-size: 12px; font-weight: 400; }
button.danger:hover { color: var(--orange); text-decoration: underline; }

/* ── identity strip: one band, not a card of labelled fields ─────────────── */
.hdr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center;
  gap: 8px 18px; flex-wrap: wrap; }
.hdr .nm { font-size: 20px; font-weight: 800; }
.hdr .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.hdr .meta { font-size: 13px; color: var(--muted); }
.hdr .meta b { color: var(--ink); font-weight: 700; }
.hdr .edit { margin-left: auto; }
.hdr .edit button { font-size: 13px; padding: 5px 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px;
  background: #eef1fc; color: var(--brand); }
.chip.off { background: #f1f3f8; color: var(--muted); }
.chip.warn { background: #fef6da; color: #8a5a00; }

/* ── KPI row: the three questions you open this page to answer ───────────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; border-left: 3px solid var(--line); }
.kpi .lab { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.kpi .lab a { margin-left: auto; font-size: 11px; }
.kpi .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1.25; }
.kpi .v.none { color: var(--muted); font-weight: 400; font-size: 20px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.due { border-left-color: var(--orange); } .kpi.due .v { color: var(--orange); }
.kpi.good { border-left-color: var(--ok); } .kpi.good .v { color: var(--ok); }
.kpi.info { border-left-color: var(--brand); } .kpi.info .v { color: var(--brand); }

/* ── detail columns ─────────────────────────────────────────────────────── */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 15px; }
h2 { font-size: 14px; margin: 0 0 9px; display: flex; align-items: baseline; gap: 8px; }
h2 .side { margin-left: auto; font-size: 12px; font-weight: 400; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; }
.kv div { font-size: 14px; }
.kv .k { font-size: 11px; color: var(--muted); display: block; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700;
  padding: 0 6px 5px; border-bottom: 1px solid var(--line); }
td { padding: 5px 6px; border-bottom: 1px solid #f4f5f9; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.due { color: var(--orange); font-weight: 700; }
.warnbox { margin-top: 8px; font-size: 12px; font-weight: 700; color: #8a5a00;
  background: #fef6da; border: 1px solid #f0dfa8; border-radius: 8px; padding: 6px 9px; }

.mrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.mstat { border: 1px solid var(--line); border-radius: 9px; padding: 5px 12px; text-align: center;
  min-width: 62px; }
.mstat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.mstat span { font-size: 11px; color: var(--muted); }

.note { border-top: 1px solid #f4f5f9; padding: 6px 0; display: flex; gap: 9px;
  align-items: baseline; }
.note:first-of-type { border-top: 0; }
.note .when { font-size: 11px; color: var(--muted); flex: none; width: 74px;
  font-variant-numeric: tabular-nums; }
.note .body { flex: 1; font-size: 13px; white-space: pre-wrap; }
/* ── 編輯表單 ─────────────────────────────────────────────
   Narrower than the page ON PURPOSE. A 姓名 box 1600px wide for three
   characters reads as a wall of rectangles, not a form — so fields are sized
   to what goes in them and grouped under three quiet headings (基本 / 聯絡 /
   修習班級). The guardian block is a real grid with ONE set of column
   headers instead of a placeholder repeated on every input. */
#editor { max-width: 820px; }
#editor h2 { margin-bottom: 14px; }
.fgroup { margin-bottom: 16px; }
.fgroup > .legend { font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: .05em; margin-bottom: 7px; }
.fld label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.fld input, .fld textarea { width: 100%; }
.frow { display: grid; gap: 10px 12px; grid-template-columns: 1.3fr 1fr 72px 1.2fr; }
@media (max-width: 720px) { .frow { grid-template-columns: 1fr 1fr; } }

/* guardian grid — 家裡 sits under the 電話 column so the numbers stack. */
.guardian { display: grid; grid-template-columns: 2.6em 1fr 1fr 1fr; gap: 6px 10px;
  align-items: center; }
.guardian .gh { font-size: 11px; color: var(--muted); padding-left: 2px; }
.guardian .glabel { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
.guardian input { width: 100%; }
.guardian .phone-only { grid-column: 3; }
.guardian .wide { grid-column: 2 / -1; }
/* `display: contents` lets each person's three inputs sit in the parent grid on
   desktop, then become their own stack on mobile — one markup, both layouts. */
.guardian .trio { display: contents; }
.guardian input::placeholder { color: transparent; }   /* the header row labels them */
.guardian .wide::placeholder { color: var(--muted); }  /* …except 其他, which has no header */
@media (max-width: 720px) {
  .guardian { grid-template-columns: 2.6em 1fr; }
  .guardian .gh, .guardian .filler { display: none; }
  .guardian .glabel { align-self: start; padding-top: 8px; }
  .guardian .trio { display: grid; gap: 6px; }
  .guardian .phone-only, .guardian .wide { grid-column: 2; }
  .guardian input::placeholder { color: var(--muted); }  /* …but there is no header row here */
}

/* class picker — pills, so 已選 is legible at a glance, not a row of ticks. */
.subjbox { display: flex; flex-wrap: wrap; gap: 7px; }
.subjbox label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 10px;
  background: #fff; cursor: pointer; }
.subjbox label:hover { border-color: #c9cee0; }
.subjbox label:has(input:checked) { border-color: var(--brand); background: #eef1fc;
  color: var(--brand); font-weight: 700; }
.subjbox input { accent-color: var(--brand); margin: 0; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  border-top: 1px solid var(--line); padding-top: 13px; }
.actions .push { margin-left: auto; }
button.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
button.ghost:hover { border-color: #c9cee0; }
/* 停用 — present, not shouting. It was a 2px orange outline competing with 儲存
   for the eye on a form you open to fix a phone number. */
button.quiet { background: transparent; color: var(--orange); font-weight: 400;
  padding: 7px 6px; }
button.quiet:hover { text-decoration: underline; }
.noteform { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 10px; }
.noteform textarea { flex: 1; resize: vertical; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>學生總覽</h1>
    <input id="find" type="search" list="findlist" placeholder="🔍 姓名 / 學號" autocomplete="off"
      style="min-width:220px">
    <datalist id="findlist"></datalist>
    <button type="button" id="btn-new">＋ 新增學生</button>
    <span class="msg" id="pickmsg"></span>
    <span class="msg"><a href="index.html">← 回後台</a>　<a href="classes.html">班級</a>
      　<span id="who"></span> <a href="#" id="btn-signout">登出</a></span>
  </div>

  <div id="body" hidden>
    <div class="card" id="editor" hidden></div>
    <div class="hdr" id="hdr"></div>
    <div class="kpis" id="kpis"></div>

    <div class="cols">
      <div class="col">
        <div class="card" id="c-learn">
          <h2>學習進度 <span class="side"><span class="msg">詳細分析在出題台</span></span></h2>
          <div id="learn"></div>
        </div>
        <div class="card" id="c-tuition" hidden>
          <h2>學費明細 <span class="side"><a href="tuition.html">收費台 →</a></span></h2>
          <div id="tuition"></div>
        </div>
      </div>

      <div class="col">
        <div class="card" id="c-contact" hidden>
          <h2>聯絡方式</h2>
          <div class="kv" id="contact"></div>
        </div>
        <div class="card" id="c-meal" hidden>
          <h2>餐費明細 <span class="side"><a href="meals.html">餐費台 →</a></span></h2>
          <div id="meal"></div>
        </div>
        <div class="card" id="c-notes" hidden>
          <h2>備註 <span class="side"><span class="msg">寫下後不可修改</span></span></h2>
          <div class="noteform">
            <textarea id="noteBody" rows="2" maxlength="2000"
              placeholder="例：8/12 媽媽來電詢問輔導班"></textarea>
            <button type="button" id="noteAdd">新增</button>
          </div>
          <span class="msg" id="notemsg"></span>
          <div id="notes"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "NT$" + Number(n || 0).toLocaleString("en-US");
const GRADE_LABEL = (g) =>
  g >= 1 && g <= 6 ? "小" + "一二三四五六"[g - 1]
  : g >= 7 && g <= 9 ? "國" + "一二三"[g - 7]
  : g >= 10 && g <= 12 ? "高" + "一二三"[g - 10]
  : (g == null ? "—" : `${g} 年級`);

let ROLE = null, SID = null, ALL = [], STU = null, CLASSES = [], ENROLL = [], NEW_CLASS = null;
// The three KPI tiles are filled by three independent async loads, so each one
// writes its own slot and the row is re-rendered from the collected state —
// otherwise whichever query returned last would blow away the others.
let KPI = {};

function kpi(key, o) { KPI[key] = o; renderKpis(); }
function renderKpis() {
  const order = ["tuition", "meal", "readiness"];
  $("kpis").innerHTML = order.filter((k) => KPI[k]).map((k) => {
    const o = KPI[k];
    return `<div class="kpi ${o.tone || ""}"><div class="lab">${esc(o.lab)}` +
      (o.link ? `<a href="${o.link}">${esc(o.linkText || "→")}</a>` : "") + "</div>" +
      `<div class="v${o.none ? " none" : ""}">${o.v}</div>` +
      (o.sub ? `<div class="sub">${esc(o.sub)}</div>` : "") + "</div>";
  }).join("");
}

(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;
  ROLE = window.CURRENT_USER_ROLE;
  const ROLE_LABEL = { owner: "負責人", admin: "主任", teacher: "老師" };
  $("btn-signout").addEventListener("click", window.signOut);
  $("who").textContent = `${window.CURRENT_USER.email} · ${ROLE_LABEL[ROLE] || ROLE}`;

  // RLS already scopes this: a teacher's list contains only students they teach.
  const { data: st, error } = await window.sb.from("students")
    .select("id, full_name, student_no, active")
    .eq("active", true).order("student_no");
  if (error) { $("pickmsg").className = "msg err"; $("pickmsg").textContent = error.message; return; }
  if (!st.length) { $("pickmsg").textContent = "沒有可檢視的學生。"; return; }

  ALL = st;
  // A 164-entry <select> is not a way to find anyone. Type-to-filter over both
  // 姓名 and 學號; the datalist option VALUE is the label the browser fills in,
  // so we resolve back to an id by matching that label.
  $("findlist").innerHTML = st.map((s) =>
    `<option value="${esc(s.student_no)}　${esc(s.full_name)}"></option>`).join("");
  const pickByLabel = () => {
    const v = $("find").value.trim();
    const hit = st.find((s) => `${s.student_no}　${s.full_name}` === v)
      || st.find((s) => s.student_no === v || s.full_name === v);
    if (hit) load(hit.id);
  };
  $("find").addEventListener("input", pickByLabel);
  $("find").addEventListener("change", pickByLabel);
  $("noteAdd").onclick = addNote;
  $("btn-new").onclick = () => openEdit(null);

  const q = new URLSearchParams(location.search);
  const qs = q.get("id");
  if (q.get("new") === "1") { NEW_CLASS = q.get("class"); openEdit(null); }
  else if (qs && st.some((s) => s.id === qs)) {
    const s0 = st.find((x) => x.id === qs);
    $("find").value = `${s0.student_no}　${s0.full_name}`;
    load(qs);
  }
})();

async function load(id) {
  SID = id || null;
  KPI = {};
  $("kpis").innerHTML = "";
  $("body").hidden = !SID;
  if (!SID) return;
  // Cosmetic deep-link update only — never let it abort the data load. (It
  // throws outright under file://, which is how this was noticed.)
  try { history.replaceState(null, "", `student.html?id=${SID}`); } catch (e) { /* ignore */ }
  await Promise.all([loadBasic(), loadTuition(), loadMeal(), loadLearn(), loadNotes()]);
}

async function loadBasic() {
  $("editor").hidden = true;
  const { data: s } = await window.sb.from("students")
    .select("id, full_name, student_no, grade, school, note, active, father_name, father_phone, " +
            "mother_name, mother_phone, home_phone, other_contact, father_line, mother_line")
    .eq("id", SID).single();
  if (!s) return;
  STU = s;

  const { data: enr } = await window.sb.from("enrollments")
    .select("active, classes(name)").eq("student_id", SID);
  const chips = (enr || []).map((e) =>
    `<span class="chip${e.active ? "" : " off"}">${esc(e.classes ? e.classes.name : "")}` +
    `${e.active ? "" : "（已停）"}</span>`).join("");

  $("hdr").innerHTML =
    `<span class="nm">${esc(s.full_name)}</span>` +
    `<span class="no">${esc(s.student_no)}</span>` +
    `<span class="meta"><b>${esc(GRADE_LABEL(s.grade))}</b>` +
    (s.school ? `　${esc(s.school)}` : "") +
    (s.note ? `　${esc(s.note)}` : "") + "</span>" +
    (s.active ? "" : '<span class="chip warn">已停用</span>') +
    `<span class="chips">${chips || '<span class="msg">未加入任何班級</span>'}</span>` +
    ((ROLE === "owner" || ROLE === "admin")
      ? `<span class="edit"><button type="button" id="btn-edit">編輯資料</button></span>` : "");
  const eb = $("btn-edit");
  if (eb) eb.onclick = () => openEdit(STU);

  // 🔑 THE ONE POLICY THIS PAGE ENFORCES IN CODE. RLS would happily hand a
  // teacher these columns for their own students (verified with a real JWT);
  // Patty's call is that it should not. Everything else here is fenced by the DB.
  const showContacts = ROLE === "owner" || ROLE === "admin";
  $("c-contact").hidden = !showContacts;
  if (showContacts) {
    const rows = [
      ["父親", s.father_name], ["父親電話", s.father_phone], ["父親 LINE", s.father_line],
      ["母親", s.mother_name], ["母親電話", s.mother_phone], ["母親 LINE", s.mother_line],
      ["家裡電話", s.home_phone], ["其他聯絡人", s.other_contact],
    ].filter(([, v]) => v);
    $("contact").innerHTML = rows.map(([k, v]) =>
      `<div><span class="k">${esc(k)}</span>${esc(v)}</div>`).join("")
      || '<p class="empty">沒有填寫聯絡方式。</p>';
  }
}

async function loadTuition() {
  if (ROLE === "teacher") { $("c-tuition").hidden = true; return; }

  const { data: rows } = await window.sb.from("tuition_outstanding_v")
    .select("class_name, term_name, expected, paid, outstanding").eq("student_id", SID);
  const { data: enr } = await window.sb.from("enrollments")
    .select("class_id").eq("student_id", SID).eq("active", true);

  if (!rows || !rows.length) {
    // No priced class at all → "—", never NT$0, which would read as "paid up".
    kpi("tuition", { lab: "本期未繳", v: "—", none: true, sub: "尚未設定班費",
                     link: "tuition.html", linkText: "收費台" });
    $("c-tuition").hidden = true;
    return;
  }
  $("c-tuition").hidden = false;
  const total = rows.reduce((a, r) => a + Number(r.outstanding || 0), 0);
  const partial = (enr || []).length > rows.length;
  kpi("tuition", {
    lab: "本期未繳", v: total <= 0 ? "已繳清" : money(total),
    tone: total <= 0 ? "good" : "due",
    sub: partial ? "⚠ 有班別尚未設定費用" : (rows[0].term_name || ""),
    link: "tuition.html", linkText: "收費台",
  });

  let html = '<table><thead><tr><th>班級</th><th class="num">應繳</th>' +
    '<th class="num">已繳</th><th class="num">未繳</th></tr></thead><tbody>' +
    rows.map((r) => `<tr><td>${esc(r.class_name)}</td><td class="num">${money(r.expected)}</td>` +
      `<td class="num">${money(r.paid)}</td>` +
      `<td class="num${Number(r.outstanding) > 0 ? " due" : ""}">${money(r.outstanding)}</td></tr>`)
      .join("") + "</tbody></table>";
  // Same trap as the parent portal: the view INNER JOINs class_fees, so a class
  // with no fee set vanishes and the total silently understates the bill.
  if (partial) html += '<div class="warnbox">有班別尚未設定本期費用，上列並非全部應繳項目。</div>';
  $("tuition").innerHTML = html;
}

async function loadMeal() {
  if (ROLE === "teacher") { $("c-meal").hidden = true; return; }

  const { data: all } = await window.sb.from("meal_ledger")
    .select("kind, amount").eq("student_id", SID).eq("voided", false);
  if (!all || !all.length) {
    // No ledger rows is NOT a zero balance — they are simply not on the meal plan.
    kpi("meal", { lab: "餐費餘額", v: "—", none: true, sub: "尚未有紀錄",
                  link: "meals.html", linkText: "餐費台" });
    $("c-meal").hidden = true;
    return;
  }
  const b = all.reduce((a, r) => a + (r.kind === "topup" ? r.amount : -r.amount), 0);
  kpi("meal", {
    lab: "餐費餘額", v: b < 0 ? "欠 " + money(-b) : money(b),
    tone: b < 500 ? "due" : "good",
    sub: b < 0 ? "已欠款" : b < 500 ? "餘額偏低" : "",
    link: "meals.html", linkText: "餐費台",
  });

  $("c-meal").hidden = false;
  const { data: led } = await window.sb.from("meal_ledger")
    .select("occurred_on, kind, amount, vendor")
    .eq("student_id", SID).eq("voided", false)
    .order("occurred_on", { ascending: false }).limit(10);
  $("meal").innerHTML =
    '<table><thead><tr><th>日期</th><th>項目</th><th class="num">金額</th></tr></thead><tbody>' +
    (led || []).map((r) => `<tr><td>${esc(r.occurred_on)}</td>` +
      `<td>${r.kind === "topup" ? "預繳" : "便當" + (r.vendor ? `（${esc(r.vendor)}）` : "")}</td>` +
      `<td class="num">${r.kind === "topup" ? "+" : "−"}${money(r.amount)}</td></tr>`).join("") +
    "</tbody></table>";
}

async function loadLearn() {
  const [snap, mast, sc] = await Promise.all([
    window.sb.from("readiness_snapshots")
      .select("snapshot_date, readiness").eq("student_id", SID)
      .order("snapshot_date", { ascending: false }).limit(1),
    window.sb.from("student_archetype_mastery").select("status").eq("student_id", SID),
    window.sb.from("scores").select("score_100, exams(name, exam_date, status)")
      .eq("student_id", SID),
  ]);

  const s = (snap.data || [])[0];
  kpi("readiness", s
    ? { lab: "會考考點覆蓋度", v: Math.round(s.readiness), tone: "info",
        sub: `已學範圍 · 統計至 ${s.snapshot_date}` }
    : { lab: "會考考點覆蓋度", v: "—", none: true, sub: "測驗批改後開始累積" });

  let html = "";
  const rows = mast.data || [];
  if (rows.length) {
    const by = {};
    rows.forEach((r) => { by[r.status] = (by[r.status] || 0) + 1; });
    html += '<div class="mrow">' + ["精熟", "接近", "不穩", "證據不足"].map((k) =>
      `<div class="mstat"><b>${by[k] || 0}</b><span>${k}</span></div>`).join("") + "</div>";
  } else {
    html += '<p class="empty">還沒有精熟度資料（需要先批改測驗）。</p>';
  }

  const graded = (sc.data || [])
    .filter((r) => r.exams && r.exams.status === "graded" && r.score_100 != null)
    .sort((a, b) => (b.exams.exam_date || "").localeCompare(a.exams.exam_date || ""))
    .slice(0, 8);
  html += graded.length
    ? '<table style="margin-top:8px"><thead><tr><th>日期</th><th>測驗</th>' +
      '<th class="num">分數</th></tr></thead><tbody>' +
      graded.map((r) => `<tr><td>${esc(r.exams.exam_date || "—")}</td>` +
        `<td>${esc(r.exams.name || "")}</td>` +
        `<td class="num"><b>${Math.round(r.score_100)}</b></td></tr>`).join("") + "</tbody></table>"
    : '<p class="empty" style="margin-top:6px">還沒有已批改的測驗。</p>';
  $("learn").innerHTML = html;
}

const nul = (v) => { const t = (v ?? "").trim(); return t === "" ? null : t; };
const num = (v) => { const t = (v ?? "").trim(); return t === "" ? null : Number(t); };
const SUBJ_ORDER = { 國文: 0, 英文: 1, 數學: 2, 自然: 3 };
const gradeSubjectClasses = (grade) => CLASSES
  .filter((c) => c.active && c.grade === grade && c.subject)
  .sort((a, b) => ((SUBJ_ORDER[a.subject] ?? 9) - (SUBJ_ORDER[b.subject] ?? 9))
    || (a.name || "").localeCompare(b.name || "", "zh-Hant"));
const studentClassIds = (sid) => new Set(ENROLL
  .filter((e) => e.student_id === sid && e.active).map((e) => e.class_id));

async function loadRefs() {
  if (CLASSES.length) return;
  const [c, e] = await Promise.all([
    window.sb.from("classes").select("id,name,grade,subject,active").order("name"),
    window.sb.from("enrollments").select("student_id,class_id,active"),
  ]);
  CLASSES = c.data || []; ENROLL = e.data || [];
}

/** s = the student row, or null to create one. */
async function openEdit(s) {
  await loadRefs();
  const newCls = s ? null : CLASSES.find((c) => c.id === NEW_CLASS);
  const grade = s ? s.grade : (newCls ? newCls.grade : null);
  const subj = grade ? gradeSubjectClasses(grade) : [];
  const has = s ? studentClassIds(s.id) : new Set(newCls ? [newCls.id] : []);
  const box = $("editor");
  box.hidden = false;
  $("body").hidden = false;
  box.innerHTML = `
    <h2>${s ? "編輯學生資料" : "新增學生"}</h2>
    <div class="fgroup">
      <div class="legend">基本資料</div>
      <div class="frow">
        <div class="fld"><label>姓名</label><input id="f-name" value="${esc(s?.full_name || "")}"></div>
        <div class="fld"><label>學號</label><input id="f-no" value="${esc(s?.student_no || "")}"></div>
        <div class="fld"><label>年級</label><input id="f-grade" type="number" min="1" max="12" value="${s?.grade ?? (newCls?.grade ?? "")}"></div>
        <div class="fld"><label>就讀學校</label><input id="f-school" value="${esc(s?.school || "")}"></div>
      </div>
    </div>
    <div class="fgroup">
      <div class="legend">家長聯絡</div>
      <div class="guardian">
        <span class="gh"></span><span class="gh">姓名</span><span class="gh">電話</span><span class="gh">LINE ID</span>
        <span class="glabel">父</span>
        <div class="trio">
          <input id="f-fname" placeholder="姓名" value="${esc(s?.father_name || "")}">
          <input id="f-fphone" placeholder="電話" inputmode="tel" value="${esc(s?.father_phone || "")}">
          <input id="f-fline" placeholder="LINE ID" value="${esc(s?.father_line || "")}">
        </div>
        <span class="glabel">母</span>
        <div class="trio">
          <input id="f-mname" placeholder="姓名" value="${esc(s?.mother_name || "")}">
          <input id="f-mphone" placeholder="電話" inputmode="tel" value="${esc(s?.mother_phone || "")}">
          <input id="f-mline" placeholder="LINE ID" value="${esc(s?.mother_line || "")}">
        </div>
        <span class="glabel">家裡</span>
        <input id="f-hphone" class="phone-only" placeholder="電話" inputmode="tel" value="${esc(s?.home_phone || "")}">
        <span class="filler"></span>
        <span class="glabel">其他</span>
        <input id="f-other" class="wide" placeholder="阿嬤 0912-…、緊急聯絡…" value="${esc(s?.other_contact || "")}">
      </div>
    </div>
    <div class="fgroup">
      <div class="legend">標註</div>
      <div class="fld"><textarea id="f-note" rows="2"
        placeholder="原校班級、座位…">${esc(s?.note || "")}</textarea></div>
    </div>
    ${subj.length ? `<div class="fgroup">
      <div class="legend">修習班級（${esc(GRADE_LABEL(grade))}）</div>
      <div class="subjbox">${subj.map((c) =>
        `<label><input type="checkbox" data-subj="${c.id}" ${has.has(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div>
    </div>` : ""}
    <div class="actions">
      <button type="button" id="f-save">${s ? "儲存" : "建立學生"}</button>
      <button type="button" class="ghost" id="f-cancel">取消</button>
      <span class="msg" id="f-msg"></span>
      ${s ? `<button type="button" class="ghost push" id="f-bind">產生家長綁定碼</button>` : ""}
      ${s ? `<button type="button" class="quiet" id="f-toggle">${s.active ? "停用" : "啟用"}</button>` : ""}
    </div>
    <div class="msg" id="f-bindout" style="margin-top:8px"></div>`;

  $("f-cancel").onclick = () => {
    box.hidden = true;
    if (!SID) $("body").hidden = true;
  };
  $("f-save").onclick = () => saveStudent(s);
  if (s) {
    $("f-toggle").onclick = async () => {
      const { error } = await window.sb.from("students")
        .update({ active: !s.active }).eq("id", s.id);
      if (error) { $("f-msg").className = "msg err"; $("f-msg").textContent = error.message; return; }
      box.hidden = true; CLASSES = []; ENROLL = []; load(s.id);
    };
    // 家長綁定碼 — parent_link_codes (migration 20260806000003). 14 天有效、父母各
    // 一次 (max_uses 2). 32-char alphabet with no 0/O/1/I divides 256 evenly → no
    // modulo bias.
    $("f-bind").onclick = async () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const buf = new Uint8Array(8);
      crypto.getRandomValues(buf);
      const code = [...buf].map((b) => chars[b % chars.length]).join("");
      const { error } = await window.sb.from("parent_link_codes")
        .insert({ code, student_id: s.id });
      if (error) { $("f-bindout").className = "msg err"; $("f-bindout").textContent = error.message; return; }
      $("f-bindout").className = "msg";
      $("f-bindout").innerHTML = `家長綁定碼：<b style="font-size:17px;letter-spacing:.2em">${code}</b>` +
        `（14 天內有效，父母各可使用一次）抄給家長 → 官網「家長專區」→ LINE 登入 → 輸入此碼。`;
    };
  }
}

async function saveStudent(s) {
  const m = $("f-msg");
  m.className = "msg";
  const fields = {
    full_name: nul($("f-name").value), student_no: nul($("f-no").value),
    school: nul($("f-school").value), grade: num($("f-grade").value),
    father_name: nul($("f-fname").value), father_phone: nul($("f-fphone").value),
    father_line: nul($("f-fline").value),
    mother_name: nul($("f-mname").value), mother_phone: nul($("f-mphone").value),
    mother_line: nul($("f-mline").value),
    home_phone: nul($("f-hphone").value), other_contact: nul($("f-other").value),
    note: nul($("f-note").value),
  };
  if (!fields.full_name) { m.className = "msg err"; m.textContent = "請輸入學生姓名"; return; }
  try {
    let id = s ? s.id : null;
    if (s) {
      const { error } = await window.sb.from("students").update(fields).eq("id", s.id);
      if (error) throw error;
    } else {
      const { data, error } = await window.sb.from("students").insert(fields).select("id").single();
      if (error) throw error;
      id = data.id;
    }
    await syncSubjects(id);
    CLASSES = []; ENROLL = [];            // force a refetch so chips reflect the save
    $("editor").hidden = true;
    location.href = `student.html?id=${id}`;
  } catch (e) {
    m.className = "msg err"; m.textContent = e.message || String(e);
  }
}

/** Ported verbatim from 名冊: if the checkbox block was never rendered (a grade
 *  with no active classes), an empty `want` would unenroll the student from
 *  everything — bail instead. Unchecking every rendered box still unenrolls;
 *  that one is deliberate. */
async function syncSubjects(studentId) {
  const boxes = [...document.querySelectorAll("[data-subj]")];
  if (!boxes.length) return;
  const want = new Set(boxes.filter((b) => b.checked).map((b) => b.dataset.subj));
  const have = studentClassIds(studentId);
  for (const id of want) {
    if (!have.has(id)) {
      const { error } = await window.sb.from("enrollments")
        .upsert({ student_id: studentId, class_id: id, active: true },
                { onConflict: "student_id,class_id" });
      if (error) throw error;
    }
  }
  const del = [...have].filter((id) => !want.has(id));
  if (del.length) {
    const { error } = await window.sb.from("enrollments")
      .delete().eq("student_id", studentId).in("class_id", del);
    if (error) throw error;
  }
}

async function loadNotes() {
  if (ROLE === "teacher") { $("c-notes").hidden = true; return; }
  $("c-notes").hidden = false;
  const { data, error } = await window.sb.from("student_notes")
    .select("id, body, created_at").eq("student_id", SID)
    .order("created_at", { ascending: false });
  if (error) { $("notes").innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  $("notes").innerHTML = (data || []).map((n) =>
    `<div class="note"><span class="when">${esc(String(n.created_at).slice(0, 10))}</span>` +
    `<span class="body">${esc(n.body)}</span>` +
    `<button class="danger" type="button" data-del="${n.id}">刪除</button></div>`).join("")
    || '<p class="empty">還沒有備註。</p>';
  $("notes").onclick = async (ev) => {
    const id = ev.target?.dataset?.del;
    if (!id || !confirm("刪除這則備註？（會留下稽核紀錄）")) return;
    const { error } = await window.sb.from("student_notes").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    loadNotes();
  };
}

async function addNote() {
  const body = $("noteBody").value.trim();
  const m = $("notemsg");
  m.className = "msg";
  if (!body) { m.className = "msg err"; m.textContent = "請先輸入內容。"; return; }
  const { error } = await window.sb.from("student_notes").insert({ student_id: SID, body });
  if (error) { m.className = "msg err"; m.textContent = error.message; return; }
  $("noteBody").value = "";
  m.textContent = "";
  loadNotes();
}
