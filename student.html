<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家偉補習班 · 學生總覽</title>
<!-- 學生總覽 — find a student, then everything about that ONE student
     (Patty, 2026-08-18; redesigned to her approved mockup 2026-09-03).

     TWO SCREENS, ONE JOB EACH.
       名單  — 年級 tabs + search + list + 新增學生. The only place the tabs live.
       學生  — a breadcrumb back to that grade's list, the name as the title, and
               two columns that mean two different things:
                 LEFT  = the record. ONE card (基本 / 家長聯絡 / 修習班級 as ruled
                         sections). 儲存 sits in the card's header, grey until a
                         field changes, and the header sticks to the top of the
                         screen on a long form. 停用學生 is a quiet last line.
                 RIGHT = what's happening: 學費 / 餐費 / 家長專區 / 備註. The money
                         figures live INSIDE their cards — there is no KPI band,
                         because for most students it read "—" twice across a
                         whole row.
     The first cut hid the guardians behind an 編輯資料 popup and kept the grade
     tabs on screen while looking at one child; both were called out and are
     the reason for this shape. 學習進度 / 會考覆蓋度 were removed the same day:
     that analysis lives in 出題台, and a "0" tile here read as a verdict on a
     child who simply had no graded exam yet.

     There is still exactly ONE place a student is written: this form (班級's
     新增學生 hands off here with ?new=1&class=…).

     🔑 ROLES ARE ENFORCED BY RLS, NOT BY THIS PAGE — with one exception.
     A teacher's JWT simply returns no rows for tuition_outstanding_v, meal_ledger,
     student_notes or parent_student (their policies are is_owner_admin()), so
     the whole right column is hidden for them rather than shown empty. The
     EXCEPTION is CONTACTS: students_select allows teaches_student(), so a
     teacher CAN read 父母電話/LINE (verified with a real JWT). Patty's call
     (2026-08-18) is that they should not see them — contacting families is
     front-desk work and this is minors' PII, the same reason the 家長報告 PDF
     omits guardian contacts. That single hide is done here in code, and is
     therefore the one thing a UI bug could expose. It is marked at the point
     of use.

     Empty states say "not yet" and render "—", never 0 — a zero here would be a
     false claim (NT$0 未繳 reads as "paid up"). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>window.PAGE_ROLES = ["owner", "admin", "teacher"];</script>
<script src="auth.js"></script>
<style>
:root {
  --brand: #2547c7; --orange: #ef5226; --gold: #f8c414; --ok: #1f7a4d;
  --bg: #f6f7fb; --surface: #fff; --ink: #1b1f2a; --muted: #6b7280; --line: #e3e6ee;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55;
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 56px; }
h1 { font-size: 18px; margin: 0; }
a { color: var(--brand); }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--orange); font-weight: 700; }
.msg.ok { color: var(--ok); font-weight: 700; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
select, input, textarea { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
input:disabled, textarea:disabled { background: #f6f7fb; color: var(--ink); border-color: #eceef4; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 7px 15px;
  background: var(--brand); color: #fff; cursor: pointer; }
button:disabled { background: #dfe3ef; color: #8a90a0; cursor: default; }
button.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
button.ghost:hover { border-color: #c9cee0; }
button.sm { padding: 5px 11px; font-size: 12px; }
button.quiet { background: transparent; color: var(--orange); font-weight: 400; padding: 0; font-size: 12px; }
button.quiet:hover { text-decoration: underline; }
button.link { background: transparent; color: var(--brand); font-weight: 400; padding: 0; font-size: 12px; }
button.link:hover { text-decoration: underline; }
button.danger { background: transparent; border: 0; color: var(--muted);
  padding: 0 4px; font-size: 12px; font-weight: 400; }
button.danger:hover { color: var(--orange); text-decoration: underline; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px;
  background: #eef1fc; color: var(--brand); white-space: nowrap; }
.chip.off { background: #f1f3f8; color: var(--muted); }
.chip.ok { background: #e6f4ec; color: var(--ok); }
.chip.warn { background: #fef6da; color: #8a5a00; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 15px; }
h2 { font-size: 14px; margin: 0 0 9px; display: flex; align-items: baseline; gap: 8px; }
h2 .side { margin-left: auto; font-size: 12px; font-weight: 400; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700;
  padding: 0 6px 5px; border-bottom: 1px solid var(--line); }
td { padding: 5px 6px; border-bottom: 1px solid #f4f5f9; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.due { color: var(--orange); font-weight: 700; }

/* ── top bars: one per screen ─────────────────────────────────────────── */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px;
  color: var(--muted); flex-wrap: wrap; }
.top #find { min-width: 240px; }
.crumb { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
  font-size: 13px; }
.crumb .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px;
  color: var(--muted); flex-wrap: wrap; }
.crumb #jump { min-width: 200px; padding: 4px 9px; font-size: 13px; }

/* ── 名單 ─────────────────────────────────────────────────────────────── */
.gradetabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.gradetabs button { background: #fff; border: 1px solid var(--line); color: var(--ink);
  font-weight: 600; font-size: 13px; padding: 6px 14px; min-width: 72px; }
.gradetabs button:hover { border-color: #c9cee0; }
.gradetabs button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.gradetabs button .n { font-weight: 400; opacity: .7; margin-left: 4px;
  font-variant-numeric: tabular-nums; font-size: 12px; }
#list .lhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
#list .lhead b { font-size: 15px; }
#list .lhead .msg { margin-left: auto; }
#list table { table-layout: fixed; }
#list th.no, #list td.no { width: 96px; font-variant-numeric: tabular-nums; color: var(--muted); }
#list th.nm, #list td.nm { width: 120px; }
#list td.nm { font-weight: 700; font-size: 14px; }
#list th.sc, #list td.sc { width: 150px; color: var(--muted); }
#list tbody tr { cursor: pointer; }
#list tbody tr:hover td { background: #f3f5fc; }
#list td { padding: 7px 6px; }
#list .chips { gap: 4px; }
#list .chip { font-size: 11px; padding: 0 8px; }
@media (max-width: 720px) {
  #list th.sc, #list td.sc { display: none; }
  #list th.no, #list td.no { width: 80px; }
}

/* ── 學生: identity line (a title, not a second form) ─────────────────── */
.ident { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
.ident .nm { font-size: 24px; font-weight: 800; line-height: 1.2; }
.ident .no { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ident .meta { font-size: 13px; color: var(--muted); }
.ident .meta b { color: var(--ink); }

.cols { display: grid; grid-template-columns: 7fr 5fr; gap: 14px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 14px; }

/* ── the record: ONE card, ruled sections, save in the header ─────────── */
.rec { padding: 0; }
/* The save bar appears the moment a field changes (or while creating) and is
   hidden otherwise — a permanent title + date row above the fields was noise
   (Patty, 2026-09-03). Sticky, so it stays reachable on a long form. */
.rec .rh { display: flex; align-items: center; gap: 10px; padding: 9px 15px;
  border-bottom: 1px solid var(--line); background: #fffbe8; border-radius: 12px 12px 0 0;
  position: sticky; top: 0; z-index: 2; }
.rec .rh[hidden] { display: none; }
.rec .rh .msg { flex: 1; }
.rec .grp { padding: 13px 15px; border-bottom: 1px solid var(--line); }
.rec .grp:last-of-type { border-bottom: 0; }
.rec .lg { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em;
  margin-bottom: 8px; }
.rec .lg.lgrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rec .foot { padding: 9px 15px; background: #fbfcff; border-top: 1px solid var(--line);
  border-radius: 0 0 12px 12px; display: flex; align-items: center; gap: 10px; }
.fld label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.fld input, .fld textarea { width: 100%; }
/* 原校班級 is students.note — 142 of 212 active students carry one and nearly
   every value is 「原校班級 806」-shaped, so it is a short field on the 基本 row,
   not a textarea called 標註 (Patty, 2026-09-03). */
.frow { display: grid; gap: 10px 12px; grid-template-columns: 1.2fr 1fr 64px 1.1fr 1fr; }
@media (max-width: 720px) { .frow { grid-template-columns: 1fr 1fr; } }

/* guardian grid — 家裡 sits under the 電話 column so the numbers stack. */
.guardian { display: grid; grid-template-columns: 2.6em 1fr 1fr 1fr; gap: 6px 10px;
  align-items: center; }
.guardian .gh { font-size: 11px; color: var(--muted); padding-left: 2px; }
.guardian .glabel { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
.guardian input { width: 100%; }
/* last row: 家裡 電話 under the 電話 column, 其他 beside it on the same line. */
.guardian .phone-only { grid-column: 3; }
.guardian .other { grid-column: 4; }
/* `display: contents` lets each person's three inputs sit in the parent grid on
   desktop, then become their own stack on mobile — one markup, both layouts. */
.guardian .trio { display: contents; }
.guardian input::placeholder { color: transparent; }   /* the header row labels them */
.guardian .other::placeholder { color: var(--muted); } /* …except 其他, which has no header */
@media (max-width: 720px) {
  .guardian { grid-template-columns: 2.6em 1fr; }
  .guardian .gh { display: none; }
  .guardian .glabel { align-self: start; padding-top: 8px; }
  .guardian .trio { display: grid; gap: 6px; }
  .guardian .phone-only, .guardian .other { grid-column: 2; }
  .guardian input::placeholder { color: var(--muted); }  /* …but there is no header row here */
}

/* class picker — pills either way, so 已選 is legible at a glance.
   國中 gets four columns by subject (英文 · 數學 · 自然/理化 · 其他), each
   stacking its classes (Patty, 2026-09-02) — 國三 alone has eight.
   國小 gets one wrapping row: three classes per grade and no 自然, so the four
   columns only spread a handful of pills over a lot of white space and squeeze
   「國小低中年級英文」 into a wrap (Patty, 2026-09-04). */
.subjbox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; }
@media (max-width: 720px) { .subjbox { grid-template-columns: 1fr 1fr; } }
.subjrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.subjcol { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.subjcol .ch { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 1px; }
.pills .none { font-size: 12px; color: var(--muted); }
.pills label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 10px;
  background: #fff; cursor: pointer; }
.pills label:hover { border-color: #c9cee0; }
.pills label:has(input:checked) { border-color: var(--brand); background: #eef1fc;
  color: var(--brand); font-weight: 700; }
.pills label:has(input:disabled) { cursor: default; }
.pills input { accent-color: var(--brand); margin: 0; }

/* ── right column: what's happening ───────────────────────────────────── */
.k { font-size: 11px; color: var(--muted); display: block; }
.big { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
.big.due { color: var(--orange); } .big.good { color: var(--ok); }
.big.none { color: var(--muted); font-weight: 400; font-size: 18px; }
.warnbox { margin-top: 8px; font-size: 12px; font-weight: 700; color: #8a5a00;
  background: #fef6da; border: 1px solid #f0dfa8; border-radius: 8px; padding: 6px 9px; }
.binds { display: flex; flex-direction: column; gap: 6px; }
.binds .b { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.binds .b .who { font-weight: 600; }
.binds .b .line { color: var(--muted); font-size: 12px; }
.binds .b .off { color: var(--orange); font-size: 12px; font-weight: 600; }
.binds .b button { margin-left: auto; }
.bindrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.bindout { font-size: 13px; color: var(--muted); }
.bindout:not(:empty) { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: #fbfcff; }
.noteform { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 10px; }
.noteform textarea { flex: 1; resize: vertical; }
.note { border-top: 1px solid #f4f5f9; padding: 6px 0; display: flex; gap: 9px;
  align-items: baseline; }
.note:first-of-type { border-top: 0; }
.note .when { font-size: 11px; color: var(--muted); flex: none; width: 74px;
  font-variant-numeric: tabular-nums; }
.note .body { flex: 1; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ── 名單 ─────────────────────────────────────────────────────────── -->
  <div id="screen-list">
    <div class="top">
      <h1>學生總覽</h1>
      <input id="find" type="search" placeholder="🔍 姓名 / 學號" autocomplete="off">
      <button type="button" id="btn-new">＋ 新增學生</button>
      <span class="msg" id="pickmsg"></span>
      <span class="right"><a href="index.html">回後台</a><a href="classes.html">班級</a>
        <span class="who"></span><a href="#" class="signout">登出</a></span>
    </div>
    <div class="gradetabs" id="grade-tabs"></div>
    <div class="card" id="list" hidden>
      <div class="lhead"><b id="ltitle"></b><span class="msg" id="lhint"></span></div>
      <div id="lrows"></div>
    </div>
  </div>

  <!-- ── 學生 ─────────────────────────────────────────────────────────── -->
  <div id="screen-stu" hidden>
    <div class="crumb">
      <a href="#" id="btn-back">← 名單</a>
      <span class="right">
        <input id="jump" type="search" placeholder="🔍 跳到其他學生" autocomplete="off">
        <a href="index.html">回後台</a><span class="who"></span><a href="#" class="signout">登出</a>
      </span>
    </div>
    <div class="ident" id="hdr"></div>

    <div class="cols">
      <div class="col"><div class="card rec" id="rec"></div></div>

      <div class="col" id="side">
        <div class="card" id="c-tuition">
          <h2>學費 <span class="side"><a href="tuition.html">收費台 →</a></span></h2>
          <div id="tuition"></div>
        </div>
        <div class="card" id="c-meal">
          <h2>餐費 <span class="side"><a href="meals.html">餐費台 →</a></span></h2>
          <div id="meal"></div>
        </div>
        <div class="card" id="c-binds">
          <h2>家長專區 <span class="side"><span class="msg">誰能在 LINE 看到這個孩子</span></span></h2>
          <div id="f-binds" class="binds"></div>
          <div class="bindrow">
            <button type="button" class="ghost sm" id="f-bind">產生家長綁定碼</button>
            <span class="msg">8 碼數字 · 14 天內有效 · 父母各一次</span>
          </div>
          <div class="bindout msg" id="f-bindout"></div>
        </div>
        <div class="card" id="c-notes">
          <h2>備註 <span class="side"><span class="msg">寫下後不可修改</span></span></h2>
          <div class="noteform">
            <textarea id="noteBody" rows="2" maxlength="2000"
              placeholder="例：8/12 媽媽來電詢問輔導班"></textarea>
            <button type="button" id="noteAdd">新增</button>
          </div>
          <span class="msg" id="notemsg"></span>
          <div id="notes"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "NT$" + Number(n || 0).toLocaleString("en-US");
const GRADE_LABEL = (g) =>
  g === 0 ? "幼大"
  : g >= 1 && g <= 6 ? "小" + "一二三四五六"[g - 1]
  : g >= 7 && g <= 9 ? "國" + "一二三"[g - 7]
  : g >= 10 && g <= 12 ? "高" + "一二三"[g - 10]
  : (g == null ? "—" : `${g} 年級`);
const SUBJ_ORDER = { 國文: 0, 英文: 1, 數學: 2, 自然: 3 };
// The picker's four columns. 理化 is its own 科目 in the bank but the same
// column here; the last column catches whatever else a class is called
// (國文, 課輔, 社會…) so a new subject never vanishes from the form.
const SUBJ_COLS = [
  ["英文", (c) => c.subject === "英文"],
  ["數學", (c) => c.subject === "數學"],
  ["自然 / 理化", (c) => c.subject === "自然" || c.subject === "理化"],
  ["其他", (c) => !["英文", "數學", "自然", "理化"].includes(c.subject)],
];

let ROLE = null, SID = null, ALL = [], STU = null, CLASSES = [], ENROLL = [], NEW_CLASS = null;
let SEL_GRADE = null, SHOW_ALL_GRADES = false;
const canEdit = () => ROLE === "owner" || ROLE === "admin";

(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;
  ROLE = window.CURRENT_USER_ROLE;
  const ROLE_LABEL = { owner: "負責人", admin: "主任", teacher: "老師" };
  document.querySelectorAll(".signout").forEach((a) => a.addEventListener("click", window.signOut));
  document.querySelectorAll(".who").forEach((el) =>
    el.textContent = `${window.CURRENT_USER.email} · ${ROLE_LABEL[ROLE] || ROLE}`);

  // RLS already scopes this: a teacher's list contains only students they teach.
  // Paged, because PostgREST silently caps a bare select at 1000 rows and a
  // roster that grows past it would just lose its tail with no error.
  const [st, enr] = await Promise.all([
    fetchAll((from, to) => window.sb.from("students")
      .select("id, full_name, student_no, grade, school, active")
      .eq("active", true).order("student_no").range(from, to)),
    fetchAll((from, to) => window.sb.from("enrollments")
      .select("student_id, classes(name, subject)").eq("active", true).range(from, to)),
  ]).catch((e) => { $("pickmsg").className = "msg err"; $("pickmsg").textContent = e.message; return [null]; });
  if (!st) return;
  if (!st.length && !canEdit()) { $("pickmsg").textContent = "沒有可檢視的學生。"; return; }

  ALL = st;
  const classesOf = {};
  (enr || []).forEach((e) => {
    if (!e.classes) return;
    (classesOf[e.student_id] ||= []).push(e.classes);
  });
  Object.values(classesOf).forEach((l) => l.sort((a, b) =>
    ((SUBJ_ORDER[a.subject] ?? 9) - (SUBJ_ORDER[b.subject] ?? 9))
    || (a.name || "").localeCompare(b.name || "", "zh-Hant")));
  st.forEach((s) => { s.classes = classesOf[s.id] || []; });

  $("find").addEventListener("input", () => showList());
  $("find").addEventListener("keydown", (ev) => {
    // Enter on a single hit opens it; Escape clears the search back to the tab.
    if (ev.key === "Enter") { const m = matches(); if (m.length === 1) load(m[0].id); }
    if (ev.key === "Escape") { $("find").value = ""; showList(); }
  });
  // 跳到其他學生 — the front desk often looks at two children in one phone
  // call. It hands the query to the list's search and goes there.
  $("jump").addEventListener("input", () => {
    $("find").value = $("jump").value; $("jump").value = "";
    showList(); $("find").focus();
  });
  $("btn-back").addEventListener("click", (ev) => { ev.preventDefault(); load(null); });
  $("btn-new").onclick = () => newStudent();
  $("btn-new").hidden = !canEdit();
  $("noteAdd").onclick = addNote;

  const q = new URLSearchParams(location.search);
  const qs = q.get("id");
  if (q.get("new") === "1" && canEdit()) { NEW_CLASS = q.get("class"); newStudent(); }
  else if (qs && st.some((s) => s.id === qs)) {
    SEL_GRADE = st.find((x) => x.id === qs).grade;
    load(qs);
  } else showList();
})();

async function fetchAll(page) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await page(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}

/* ── 名單 ──────────────────────────────────────────────────────────────── */
// Tabs come from the DATA, not a literal (same rule as 班級): a grade with no
// student has no tab, and the 國小部 appears the moment a 小四 is enrolled.
const gradesPresent = () =>
  [...new Set(ALL.map((s) => s.grade))].sort((a, b) => (a ?? 99) - (b ?? 99));

function renderGradeTabs() {
  const grades = gradesPresent();
  if (!grades.includes(SEL_GRADE)) SEL_GRADE = grades.includes(7) ? 7 : grades[0];
  const searching = $("find").value.trim() !== "";
  $("grade-tabs").innerHTML = grades.map((g) => {
    const n = ALL.filter((s) => s.grade === g).length;
    const on = !searching && SEL_GRADE === g;
    return `<button type="button" data-grade="${g ?? ""}" class="${on ? "on" : ""}">` +
      `${esc(GRADE_LABEL(g))}<span class="n">${n}</span></button>`;
  }).join("");
  $("grade-tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
    SEL_GRADE = b.dataset.grade === "" ? null : Number(b.dataset.grade);
    $("find").value = "";
    showList();
  });
}

/** The rows the list should show right now: a search wins over the tab and
 *  crosses every grade, since the person typing a name doesn't know which
 *  年級 to look under. */
function matches() {
  const v = $("find").value.trim().toLowerCase();
  if (v) return ALL.filter((s) =>
    (s.full_name || "").toLowerCase().includes(v) || (s.student_no || "").toLowerCase().includes(v));
  return ALL.filter((s) => s.grade === SEL_GRADE);
}

const nul = (v) => { const t = (v ?? "").trim(); return t === "" ? null : t; };
const num = (v) => { const t = (v ?? "").trim(); return t === "" ? null : Number(t); };
/** A class's `grade` is the bucket it is FILED under, not a fence on who sits in
 *  it. 國小低中年級數學/英文/課輔 are filed at 4 but serve 小一–小四, and 15
 *  students are placed a grade up (小六 in a 國一 class, 國二 in 國三). Filtering
 *  the picker on `c.grade === student.grade` therefore hid real enrolments — the
 *  chips said 三班, the picker said 「這個年級還沒有開班」— and, being unrendered,
 *  they could not be taken away here either. So: own grade + everything the
 *  student is already in, and 顯示其他年級 opens the rest, which is the only way
 *  to reach a class for 小一–小三 and 幼大, whose grades have no class at all. */
const pickerClasses = (grade, keep, allGrades) => CLASSES
  .filter((c) => c.active && c.subject
    && (allGrades || c.grade === grade || keep.has(c.id)))
  .sort((a, b) => ((a.grade === grade ? 0 : 1) - (b.grade === grade ? 0 : 1))
    || ((a.grade ?? 99) - (b.grade ?? 99))
    || ((SUBJ_ORDER[a.subject] ?? 9) - (SUBJ_ORDER[b.subject] ?? 9))
    || (a.name || "").localeCompare(b.name || "", "zh-Hant"));
const studentClassIds = (sid) => new Set(ENROLL
  .filter((e) => e.student_id === sid && e.active).map((e) => e.class_id));

async function loadRefs() {
  if (CLASSES.length) return;
  const [c, e] = await Promise.all([
    window.sb.from("classes").select("id,name,grade,subject,active").order("name"),
    window.sb.from("enrollments").select("student_id,class_id,active"),
  ]);
  CLASSES = c.data || []; ENROLL = e.data || [];
}

/** s = the student row, or null to create one. Renders the record as ONE card:
 *  基本 / 家長聯絡 / 修習班級 as ruled sections, 儲存 in the header (disabled
 *  until something changes), 停用學生 as the quiet last line. Owner/主任 edit;

  // 🔑 THE ONE POLICY THIS PAGE ENFORCES IN CODE. RLS would happily hand a
  // teacher 父母電話/LINE for their own students (verified with a real JWT);

  $("rec").innerHTML = `

    <div class="grp">

        <div class="fld"><label>學號</label><input id="f-no"${dis} value="${esc(s?.student_no || "")}"></div>
        <div class="fld"><label>年級</label><input id="f-grade"${dis} type="number" min="0" max="12" value="${s?.grade ?? (newCls?.grade ?? "")}"></div>
        <div class="fld"><label>就讀學校</label><input id="f-school"${dis} value="${esc(s?.school || "")}"></div>
        <div class="fld"><label>原校班級</label><input id="f-note"${dis} placeholder="806、4年乙班" value="${esc(s?.note || "")}"></div>
      </div>
    </div>
    ${showContacts ? `<div class="grp">
      <div class="lg">家長聯絡</div>
      <div class="guardian">
        <span class="gh"></span><span class="gh">姓名</span><span class="gh">電話</span><span class="gh">LINE ID</span>

  renderClasses(grade, has, edit);

  if (!edit) return;
  $("f-save").onclick = () => saveStudent(s);

    $("f-msg").className = "msg"; $("f-msg").textContent = "有未儲存的變更";

/** The 修習班級 section. It re-renders ITSELF on 顯示其他年級 rather than going
 *  back through renderForm, so a half-typed 電話 two sections up survives the
 *  toggle — and it reads the ticks back off the DOM, so a tick made before the
 *  toggle survives it too.
 *  `enrolled` is the DB truth; anything in it renders whatever its grade, which
 *  is also what keeps syncSubjects able to remove it (that only deletes classes
 *  it actually rendered). */
function renderClasses(grade, enrolled, edit) {
  const box = $("f-classes");
  const dis = edit ? "" : " disabled";
  const drawn = [...box.querySelectorAll("[data-subj]")];
  const ticked = drawn.length
    ? new Set(drawn.filter((b) => b.checked).map((b) => b.dataset.subj))
    : new Set(enrolled);
  const keep = new Set([...enrolled, ...ticked]);
  const subj = grade != null ? pickerClasses(grade, keep, SHOW_ALL_GRADES) : [];
  const offGrade = grade != null
    && CLASSES.some((c) => c.active && c.subject && c.grade !== grade);
  // 國小 is a single wrapping row — nine classes across the whole grade, and no
  // 自然, so the subject columns had nothing to organise. 國中 keeps them.
  const flat = grade != null && grade <= 6;
  // Just the class name, exactly as the chips beside 姓名 read it. No grade
  // badge: every name already carries its own grade (小五數學, 國一英A) and the
  // three 國小低中年級* say what they are (Patty, 2026-09-05).
  const pill = (c) =>
    `<label><input type="checkbox"${dis} data-subj="${c.id}"${
      ticked.has(c.id) ? " checked" : ""}>${esc(c.name)}</label>`;

  box.innerHTML =
    `<div class="lg${edit && offGrade ? " lgrow" : ""}">` +
    `<span>修習班級${grade != null ? `（${esc(GRADE_LABEL(grade))}）` : ""}</span>` +
    (edit && offGrade
      ? `<button type="button" class="link" id="f-allgrades">${
          SHOW_ALL_GRADES ? "只看本年級" : "顯示其他年級"}</button>`
      : "") + "</div>" +
    (subj.length
      ? (flat
        ? `<div class="pills subjrow">${subj.map(pill).join("")}</div>`
        : `<div class="pills subjbox">${SUBJ_COLS.map(([head, pick]) => {
            const cs = subj.filter(pick);
            return `<div class="subjcol"><span class="ch">${head}</span>`
              + (cs.map(pill).join("") || '<span class="none">—</span>') + "</div>";
          }).join("")}</div>`)
      : `<p class="empty">${grade != null
          ? "這個年級還沒有開班" + (edit && offGrade ? "，按「顯示其他年級」挑其他班。" : "。")
          : "先填年級並建立，再選班級。"}</p>`);

  const all = $("f-allgrades");
  if (all) all.onclick = () => {
    SHOW_ALL_GRADES = !SHOW_ALL_GRADES;
    renderClasses(grade, enrolled, edit);
  };
}

/** 家長專區 — who can currently see this student in the LIFF, and the only way
 *  to take that away. A family that leaves goes quiet (enrollments.active=false
 *  empties every parent view) but stays BOUND, which privacy-v2 promises is
 *  undoable on request. */
async function renderBinds(s) {
  const box = $("f-binds");
  $("f-bindout").className = "bindout msg"; $("f-bindout").textContent = "";
  const { data, error } = await window.sb
    .from("parent_student")
    .select("parent_id, parents(id, full_name, line_display_name, profile_id)")
    .eq("student_id", s.id);
  if (error) { box.innerHTML = `<span class="msg err">${esc(error.message)}</span>`; return; }
  const rows = (data || []).filter((r) => r.parents);
  if (!rows.length) {
    box.innerHTML = `<span class="msg">尚未有家長綁定。</span>`;
  } else {
    // profiles.active is what parent-login re-reads on every login, so it — not
    // the link — is what "can they still get in" actually means.
    const pids = rows.map((r) => r.parents.profile_id).filter(Boolean);
    const { data: profs } = pids.length
      ? await window.sb.from("profiles").select("id, active").in("id", pids)
      : { data: [] };
    const activeOf = new Map((profs || []).map((p) => [p.id, p.active !== false]));
    box.innerHTML = rows.map((r) => {
      const p = r.parents;
      const on = p.profile_id ? activeOf.get(p.profile_id) !== false : true;
      return `<div class="b" data-pid="${esc(p.id)}">
        <span class="who">${esc(p.full_name || p.line_display_name || "（未具名家長）")}</span>
        ${p.line_display_name && p.full_name ? `<span class="line">LINE：${esc(p.line_display_name)}</span>` : ""}
        ${on ? "" : `<span class="off">帳號已停用</span>`}
        <button type="button" class="quiet" data-unbind>解除綁定</button>
      </div>`;
    }).join("");
  }

  box.querySelectorAll("[data-unbind]").forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest(".b");
      const who = row.querySelector(".who").textContent;
      // Spell out both side effects — the consent record surviving is a
      // deliberate 個資法 decision (Patty, 2026-08-23), not an oversight, and
      // the reader of this dialog is the person who has to defend it.
      if (!confirm(
        `解除「${who}」與 ${s.full_name} 的綁定？\n\n` +
        `・家長立刻看不到這個孩子的任何資料\n` +
        `・若這是他綁定的最後一個孩子，帳號會一併停用\n` +
        `・同意紀錄會保留（證明當初有取得同意），不會刪除\n\n` +
        `之後要恢復，重新發一次綁定碼即可。`)) return;
      btn.disabled = true;
      const { data, error } = await window.sb.rpc("parent_unbind", {
        p_parent_id: row.dataset.pid, p_student_id: s.id,
      });
      if (error || !data?.ok) {
        btn.disabled = false;
        $("f-bindout").className = "bindout msg err";
        $("f-bindout").textContent = "解除失敗：" + (error?.message || data?.error || "unknown");
        return;
      }
      await renderBinds(s);
      $("f-bindout").className = "bindout msg";
      $("f-bindout").textContent = `已解除「${who}」的綁定。` +
        (data.deactivated ? "這是他的最後一個孩子，帳號已停用。" : "") +
        (data.codes_expired ? `　這位學生已無綁定家長，${data.codes_expired} 組未使用的綁定碼一併失效。` : "") +
        "　同意紀錄保留。";
    };
  });

  // 家長綁定碼 — parent_link_codes (migration 20260806000003). 14 天有效、父母各
  // 一次 (max_uses 2). 8 DIGITS since 2026-09-02 (Patty's call — readable off a
  // paper slip); the guess budget is parent_bind()'s 5/h limit, so the
  // alphabet shrinking is fine but the length must stay 8. Bytes ≥250 are
  // rejected so `% 10` is uniform — no modulo bias.
  $("f-bind").onclick = async () => {
    const digits = [];
    while (digits.length < 8) {
      const buf = new Uint8Array(16);
      crypto.getRandomValues(buf);
      for (const b of buf) if (b < 250 && digits.length < 8) digits.push(b % 10);
    }
    const code = digits.join("");
    const { error } = await window.sb.from("parent_link_codes")
      .insert({ code, student_id: s.id });
    if (error) { $("f-bindout").className = "bindout msg err"; $("f-bindout").textContent = error.message; return; }
    $("f-bindout").className = "bindout msg";
    $("f-bindout").innerHTML = `家長綁定碼：<b style="font-size:17px;letter-spacing:.2em">${code.slice(0, 4)} ${code.slice(4)}</b>` +
      `（14 天內有效，父母各可使用一次）抄給家長 → 官網「家長專區」→ LINE 登入 → 輸入此碼。`;
  };
}

async function loadTuition() {
  const { data: rows } = await window.sb.from("tuition_outstanding_v")
    .select("class_name, term_name, expected, paid, outstanding").eq("student_id", SID);
  const { data: enr } = await window.sb.from("enrollments")
    .select("class_id").eq("student_id", SID).eq("active", true);

  if (!rows || !rows.length) {
    // No priced class at all → "—", never NT$0, which would read as "paid up".
    $("tuition").innerHTML = '<span class="k">本期未繳</span><div class="big none">—</div>' +
      '<span class="msg">尚未設定班費</span>';
    return;
  }
  const total = rows.reduce((a, r) => a + Number(r.outstanding || 0), 0);
  const partial = (enr || []).length > rows.length;
  let html = `<span class="k">本期未繳${rows[0].term_name ? " · " + esc(rows[0].term_name) : ""}</span>` +
    `<div class="big ${total <= 0 ? "good" : "due"}">${total <= 0 ? "已繳清" : money(total)}</div>` +
    '<table style="margin-top:8px"><thead><tr><th>班級</th><th class="num">應繳</th>' +
    '<th class="num">已繳</th><th class="num">未繳</th></tr></thead><tbody>' +
    rows.map((r) => `<tr><td>${esc(r.class_name)}</td><td class="num">${money(r.expected)}</td>` +
      `<td class="num">${money(r.paid)}</td>` +
      `<td class="num${Number(r.outstanding) > 0 ? " due" : ""}">${money(r.outstanding)}</td></tr>`)
      .join("") + "</tbody></table>";
  // Same trap as the parent portal: the view INNER JOINs class_fees, so a class
  // with no fee set vanishes and the total silently understates the bill.
  if (partial) html += '<div class="warnbox">有班別尚未設定本期費用，上列並非全部應繳項目。</div>';
  $("tuition").innerHTML = html;
}

async function loadMeal() {
  const { data: all } = await window.sb.from("meal_ledger")
    .select("kind, amount").eq("student_id", SID).eq("voided", false);
  if (!all || !all.length) {
    // No ledger rows is NOT a zero balance — they are simply not on the meal plan.
    $("meal").innerHTML = '<span class="k">餘額</span><div class="big none">—</div>' +
      '<span class="msg">尚未有紀錄</span>';
    return;
  }
  const b = all.reduce((a, r) => a + (r.kind === "topup" ? r.amount : -r.amount), 0);
  const { data: led } = await window.sb.from("meal_ledger")
    .select("occurred_on, kind, amount, vendor")
    .eq("student_id", SID).eq("voided", false)
    .order("occurred_on", { ascending: false }).limit(10);
  $("meal").innerHTML =
    '<span class="k">餘額</span>' +
    `<div class="big ${b < 500 ? "due" : "good"}">${b < 0 ? "欠 " + money(-b) : money(b)}</div>` +
    (b < 0 ? '<span class="msg">已欠款</span>' : b < 500 ? '<span class="msg">餘額偏低</span>' : "") +
    '<table style="margin-top:8px"><thead><tr><th>日期</th><th>項目</th><th class="num">金額</th></tr></thead><tbody>' +
    (led || []).map((r) => `<tr><td>${esc(r.occurred_on)}</td>` +
      `<td>${r.kind === "topup" ? "預繳" : "便當" + (r.vendor ? `（${esc(r.vendor)}）` : "")}</td>` +
      `<td class="num">${r.kind === "topup" ? "+" : "−"}${money(r.amount)}</td></tr>`).join("") +
    "</tbody></table>";
}

async function saveStudent(s) {
  const m = $("f-msg");
  m.className = "msg";
  const v = (id) => { const el = $(id); return el ? nul(el.value) : undefined; };
  const fields = {
    full_name: v("f-name"), student_no: v("f-no"),
    school: v("f-school"), grade: num($("f-grade").value),
    father_name: v("f-fname"), father_phone: v("f-fphone"), father_line: v("f-fline"),
    mother_name: v("f-mname"), mother_phone: v("f-mphone"), mother_line: v("f-mline"),
    home_phone: v("f-hphone"), other_contact: v("f-other"),
    note: v("f-note"),
  };
  Object.keys(fields).forEach((k) => { if (fields[k] === undefined) delete fields[k]; });
  if (!fields.full_name) { $("f-bar").hidden = false; m.className = "msg err"; m.textContent = "請輸入學生姓名"; return; }
  $("f-save").disabled = true;
  try {
    let id = s ? s.id : null;
    if (s) {
      const { error } = await window.sb.from("students").update(fields).eq("id", s.id);
      if (error) throw error;
    } else {
      const { data, error } = await window.sb.from("students").insert(fields).select("id").single();
      if (error) throw error;
      id = data.id;
    }
    await syncSubjects(id);
    CLASSES = []; ENROLL = [];            // force a refetch so chips reflect the save
    if (!s) { location.href = `student.html?id=${id}`; return; }
    // Stay put: refresh the roster row (name/grade may have changed) and the page.
    const { data: row } = await window.sb.from("students")
      .select("id, full_name, student_no, grade, school, active").eq("id", id).single();
    const i = ALL.findIndex((x) => x.id === id);
    if (row && i >= 0) ALL[i] = { ...ALL[i], ...row };
    await loadBasic();
    const bar = $("f-bar"), fm = $("f-msg");
    if (bar && fm) {
      bar.hidden = false; fm.className = "msg ok"; fm.textContent = "已儲存 ✓";
      setTimeout(() => { if (fm.textContent === "已儲存 ✓") bar.hidden = true; }, 2000);
    }
  } catch (e) {
    $("f-bar").hidden = false;
    $("f-save").disabled = false;
    m.className = "msg err"; m.textContent = e.message || String(e);
  }
}

/** Ported verbatim from 名冊: if the checkbox block was never rendered (a grade
 *  with no active classes), an empty `want` would unenroll the student from
 *  everything — bail instead. Unchecking every rendered box still unenrolls;
 *  that one is deliberate.
 *
 *  `del` is scoped to what was rendered, so an enrollment the picker did not
 *  draw is never wiped by a save. Cross-grade ones now DO draw (pickerClasses
 *  keeps every class the student is in), so 國二數A on a 國一 is both visible and
 *  removable; what the guard still covers is an enrollment in a class that has
 *  since been 停用 or lost its 科目 — not offered here, so not deleted here. */
async function syncSubjects(studentId) {
  const boxes = [...document.querySelectorAll("[data-subj]")];
  if (!boxes.length) return;
  const want = new Set(boxes.filter((b) => b.checked).map((b) => b.dataset.subj));
  const rendered = new Set(boxes.map((b) => b.dataset.subj));
  const have = studentClassIds(studentId);
  for (const id of want) {
    if (!have.has(id)) {
      const { error } = await window.sb.from("enrollments")
        .upsert({ student_id: studentId, class_id: id, active: true },
                { onConflict: "student_id,class_id" });
      if (error) throw error;
    }
  }
  const del = [...have].filter((id) => rendered.has(id) && !want.has(id));
  if (del.length) {
    const { error } = await window.sb.from("enrollments")
      .delete().eq("student_id", studentId).in("class_id", del);
    if (error) throw error;
  }
}

async function loadNotes() {
  const { data, error } = await window.sb.from("student_notes")
    .select("id, body, created_at").eq("student_id", SID)
    .order("created_at", { ascending: false });
  if (error) { $("notes").innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  $("notes").innerHTML = (data || []).map((n) =>
    `<div class="note"><span class="when">${esc(String(n.created_at).slice(0, 10))}</span>` +
    `<span class="body">${esc(n.body)}</span>` +
    `<button class="danger" type="button" data-del="${n.id}">刪除</button></div>`).join("")
    || '<p class="empty">還沒有備註。</p>';
  $("notes").onclick = async (ev) => {
    const id = ev.target?.dataset?.del;
    if (!id || !confirm("刪除這則備註？（會留下稽核紀錄）")) return;
    const { error } = await window.sb.from("student_notes").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    loadNotes();
  };
}

async function addNote() {
  const body = $("noteBody").value.trim();
  const m = $("notemsg");
  m.className = "msg";
  if (!body) { m.className = "msg err"; m.textContent = "請先輸入內容。"; return; }
  const { error } = await window.sb.from("student_notes").insert({ student_id: SID, body });
  if (error) { m.className = "msg err"; m.textContent = error.message; return; }
  $("noteBody").value = "";
  m.textContent = "";
  loadNotes();
}
