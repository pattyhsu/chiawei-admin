<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家偉補習班 · 學生總覽</title>
<!-- 學生總覽 — everything about ONE student on one page (Patty, 2026-08-18).

     The data already existed, spread across 名冊 / 收費台 / 餐費台 / 分析報告.
     This is the read view that pulls them together; 編輯 jumps to 名冊, so there
     is still exactly ONE place where student data is written.

     LAYOUT: scanned, not read. Identity strip → two KPI tiles (未繳 / 餐費餘額)
     → detail in columns: everything the 編輯 form holds is READABLE on the page
     (基本資料 / 家長聯絡 / 家長專區綁定), so opening a student shows the student
     and 編輯資料 is only for changing something (Patty, 2026-09-03 — the first
     cut hid the guardians behind the edit button). 學習進度 / 會考覆蓋度 were
     removed the same day: that analysis lives in 出題台, and a "0" tile here
     read as a verdict on a child who simply had no graded exam yet.

     🔑 ROLES ARE ENFORCED BY RLS, NOT BY THIS PAGE — with one exception.
     A teacher's JWT simply returns no rows for tuition_outstanding_v, meal_ledger
     or student_notes (their policies are is_owner_admin()), so those sections
     come back empty without this page deciding anything. The EXCEPTION is
     CONTACTS: students_select allows teaches_student(), so a teacher CAN read
     父母電話/LINE (verified with a real JWT). Patty's call (2026-08-18) is that
     they should not see them — contacting families is front-desk work and this is
     minors' PII, the same reason the 家長報告 PDF omits guardian contacts. That
     single hide is done here in code, and is therefore the one thing a UI bug
     could expose. It is marked at the point of use.

     Empty states say "not yet" and render "—", never 0 — a zero here would be a
     false claim (NT$0 未繳 reads as "paid up"). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>window.PAGE_ROLES = ["owner", "admin", "teacher"];</script>
<script src="auth.js"></script>
<style>
:root {
  --brand: #2547c7; --orange: #ef5226; --gold: #f8c414; --ok: #1f7a4d;
  --bg: #f6f7fb; --surface: #fff; --ink: #1b1f2a; --muted: #6b7280; --line: #e3e6ee;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55;
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 56px; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; }
.top .msg { margin-left: auto; }
a { color: var(--brand); }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--orange); font-weight: 700; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
select, input, textarea { font: inherit; padding: 6px 9px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; color: var(--ink); }
select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 7px 15px;
  background: var(--brand); color: #fff; cursor: pointer; }
button.danger { background: transparent; border: 0; color: var(--muted);
  padding: 0 4px; font-size: 12px; font-weight: 400; }
button.danger:hover { color: var(--orange); text-decoration: underline; }

/* ── browse: grade tabs + the list ───────────────────────────────────────
   The page used to open on nothing: a search box and a blank canvas, so you
   had to already know a name to see anyone. Now it opens on a 年級 tab and
   its students, and the search narrows across every grade as you type. */
.gradetabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.gradetabs button { background: #fff; border: 1px solid var(--line); color: var(--ink);
  font-weight: 600; font-size: 13px; padding: 6px 14px; min-width: 72px; }
.gradetabs button:hover { border-color: #c9cee0; }
.gradetabs button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.gradetabs button .n { font-weight: 400; opacity: .7; margin-left: 4px;
  font-variant-numeric: tabular-nums; font-size: 12px; }
#list .lhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
#list .lhead b { font-size: 15px; }
#list .lhead .msg { margin-left: auto; }
#list table { table-layout: fixed; }
#list th.no, #list td.no { width: 96px; font-variant-numeric: tabular-nums; color: var(--muted); }
#list th.nm, #list td.nm { width: 120px; }
#list td.nm { font-weight: 700; font-size: 14px; }
#list th.sc, #list td.sc { width: 150px; color: var(--muted); }
#list tbody tr { cursor: pointer; }
#list tbody tr:hover td { background: #f3f5fc; }
#list td { padding: 7px 6px; }
#list .chips { gap: 4px; }
#list .chip { font-size: 11px; padding: 0 8px; white-space: nowrap; }
.top .back { display: none; }
body.viewing .top .back { display: inline; }
@media (max-width: 720px) {
  #list th.sc, #list td.sc { display: none; }
  #list th.no, #list td.no { width: 80px; }
}

/* ── identity strip: one band, not a card of labelled fields ─────────────── */
.hdr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center;
  gap: 8px 18px; flex-wrap: wrap; }
.hdr .nm { font-size: 20px; font-weight: 800; }
.hdr .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.hdr .meta { font-size: 13px; color: var(--muted); }
.hdr .meta b { color: var(--ink); font-weight: 700; }
.hdr .edit { margin-left: auto; }
.hdr .edit button { font-size: 13px; padding: 5px 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px;
  background: #eef1fc; color: var(--brand); }
.chip.off { background: #f1f3f8; color: var(--muted); }
.chip.warn { background: #fef6da; color: #8a5a00; }

/* ── KPI row: the three questions you open this page to answer ───────────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; border-left: 3px solid var(--line); }
.kpi .lab { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.kpi .lab a { margin-left: auto; font-size: 11px; }
.kpi .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1.25; }
.kpi .v.none { color: var(--muted); font-weight: 400; font-size: 20px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.due { border-left-color: var(--orange); } .kpi.due .v { color: var(--orange); }
.kpi.good { border-left-color: var(--ok); } .kpi.good .v { color: var(--ok); }
.kpi.info { border-left-color: var(--brand); } .kpi.info .v { color: var(--brand); }

/* ── detail columns ─────────────────────────────────────────────────────── */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 15px; }
h2 { font-size: 14px; margin: 0 0 9px; display: flex; align-items: baseline; gap: 8px; }
h2 .side { margin-left: auto; font-size: 12px; font-weight: 400; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700;
  padding: 0 6px 5px; border-bottom: 1px solid var(--line); }
td { padding: 5px 6px; border-bottom: 1px solid #f4f5f9; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.due { color: var(--orange); font-weight: 700; }
.warnbox { margin-top: 8px; font-size: 12px; font-weight: 700; color: #8a5a00;
  background: #fef6da; border: 1px solid #f0dfa8; border-radius: 8px; padding: 6px 9px; }

.mrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.mstat { border: 1px solid var(--line); border-radius: 9px; padding: 5px 12px; text-align: center;
  min-width: 62px; }
.mstat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.mstat span { font-size: 11px; color: var(--muted); }

.note { border-top: 1px solid #f4f5f9; padding: 6px 0; display: flex; gap: 9px;
  align-items: baseline; }
.note:first-of-type { border-top: 0; }
.note .when { font-size: 11px; color: var(--muted); flex: none; width: 74px;
  font-variant-numeric: tabular-nums; }
.note .body { flex: 1; font-size: 13px; white-space: pre-wrap; }
/* ── 編輯表單 — ON THE PAGE, not a popup (Patty, 2026-09-03) ──────────
   The record is the form: every field sits in a card in the left column and
   儲存 is a bar under them. Fields are sized to what goes in them and grouped
   under quiet headings (基本 / 家長聯絡 / 修習班級 / 家長專區綁定). A teacher
   sees the same cards read-only (inputs disabled, no 儲存 bar). */
.card .fgroup { margin-bottom: 0; }
.binds { display: flex; flex-direction: column; gap: 6px; }
.binds .b {
  display: flex; align-items: baseline; gap: 10px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
}
.binds .b .who { font-weight: 600; }
.binds .b .line { color: var(--muted); font-size: 12px; }
.binds .b .off { color: var(--orange); font-size: 12px; font-weight: 600; }
.binds .b button { margin-left: auto; }
.bindrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.bindout { font-size: 13px; color: var(--muted); }
.bindout:not(:empty) { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: #fbfcff; }
.fgroup { margin-bottom: 16px; }
.fgroup > .legend { font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: .05em; margin-bottom: 7px; }
.fld label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.fld input, .fld textarea { width: 100%; }
.frow { display: grid; gap: 10px 12px; grid-template-columns: 1.3fr 1fr 72px 1.2fr; }
@media (max-width: 720px) { .frow { grid-template-columns: 1fr 1fr; } }

/* guardian grid — 家裡 sits under the 電話 column so the numbers stack. */
.guardian { display: grid; grid-template-columns: 2.6em 1fr 1fr 1fr; gap: 6px 10px;
  align-items: center; }
.guardian .gh { font-size: 11px; color: var(--muted); padding-left: 2px; }
.guardian .glabel { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
.guardian input { width: 100%; }
.guardian .phone-only { grid-column: 3; }
.guardian .wide { grid-column: 2 / -1; }
/* `display: contents` lets each person's three inputs sit in the parent grid on
   desktop, then become their own stack on mobile — one markup, both layouts. */
.guardian .trio { display: contents; }
.guardian input::placeholder { color: transparent; }   /* the header row labels them */
.guardian .wide::placeholder { color: var(--muted); }  /* …except 其他, which has no header */
@media (max-width: 720px) {
  .guardian { grid-template-columns: 2.6em 1fr; }
  .guardian .gh, .guardian .filler { display: none; }
  .guardian .glabel { align-self: start; padding-top: 8px; }
  .guardian .trio { display: grid; gap: 6px; }
  .guardian .phone-only, .guardian .wide { grid-column: 2; }
  .guardian input::placeholder { color: var(--muted); }  /* …but there is no header row here */
}

/* class picker — four columns by subject (英文 · 數學 · 自然 · 其他), each
   stacking its classes, so 國一數A/數B sit under one heading instead of
   scattering across a wrapped row (Patty, 2026-09-02). Pills, so 已選 is
   legible at a glance, not a row of ticks. */
.subjbox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; }
@media (max-width: 720px) { .subjbox { grid-template-columns: 1fr 1fr; } }
.subjcol { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.subjcol .ch { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 1px; }
.subjcol .none { font-size: 12px; color: var(--muted); }
.subjbox label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 10px;
  background: #fff; cursor: pointer; }
.subjbox label:hover { border-color: #c9cee0; }
.subjbox label:has(input:checked) { border-color: var(--brand); background: #eef1fc;
  color: var(--brand); font-weight: 700; }
.subjbox input { accent-color: var(--brand); margin: 0; }

.savebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  position: sticky; bottom: 0; background: var(--surface); box-shadow: 0 -6px 16px rgba(0,0,0,.05); }
.savebar .push { margin-left: auto; }
.savebar .msg { flex: 1; }
.savebar .msg.ok { color: var(--ok); font-weight: 700; }
input:disabled, textarea:disabled { background: #f6f7fb; color: var(--ink); border-color: #eceef4; }
.subjbox label:has(input:disabled) { cursor: default; }
button.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
button.ghost:hover { border-color: #c9cee0; }
/* 停用 — present, not shouting. It was a 2px orange outline competing with 儲存
   for the eye on a form you open to fix a phone number. */
button.quiet { background: transparent; color: var(--orange); font-weight: 400;
  padding: 7px 6px; }
button.quiet:hover { text-decoration: underline; }
.noteform { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 10px; }
.noteform textarea { flex: 1; resize: vertical; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>學生總覽</h1>
    <input id="find" type="search" placeholder="🔍 姓名 / 學號" autocomplete="off"
      style="min-width:220px">
    <button type="button" id="btn-new">＋ 新增學生</button>
    <a href="#" class="back" id="btn-back">← 回名單</a>
    <span class="msg" id="pickmsg"></span>
    <span class="msg"><a href="index.html">← 回後台</a>　<a href="classes.html">班級</a>
      　<span id="who"></span> <a href="#" id="btn-signout">登出</a></span>
  </div>

  <div class="gradetabs" id="grade-tabs"></div>

  <div class="card" id="list" hidden>
    <div class="lhead"><b id="ltitle"></b><span class="msg" id="lhint"></span></div>
    <div id="lrows"></div>
  </div>

  <div id="body" hidden>
    <div class="hdr" id="hdr"></div>
    <div class="kpis" id="kpis"></div>

    <div class="cols">
      <div class="col" id="form"></div>

      <div class="col" id="side">
        <div class="card" id="c-tuition" hidden>
          <h2>學費明細 <span class="side"><a href="tuition.html">收費台 →</a></span></h2>
          <div id="tuition"></div>
        </div>
        <div class="card" id="c-meal" hidden>
          <h2>餐費明細 <span class="side"><a href="meals.html">餐費台 →</a></span></h2>
          <div id="meal"></div>
        </div>
        <div class="card" id="c-notes" hidden>
          <h2>備註 <span class="side"><span class="msg">寫下後不可修改</span></span></h2>
          <div class="noteform">
            <textarea id="noteBody" rows="2" maxlength="2000"
              placeholder="例：8/12 媽媽來電詢問輔導班"></textarea>
            <button type="button" id="noteAdd">新增</button>
          </div>
          <span class="msg" id="notemsg"></span>
          <div id="notes"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "NT$" + Number(n || 0).toLocaleString("en-US");
const GRADE_LABEL = (g) =>
  g === 0 ? "幼大"
  : g >= 1 && g <= 6 ? "小" + "一二三四五六"[g - 1]
  : g >= 7 && g <= 9 ? "國" + "一二三"[g - 7]
  : g >= 10 && g <= 12 ? "高" + "一二三"[g - 10]
  : (g == null ? "—" : `${g} 年級`);

const SUBJ_ORDER = { 國文: 0, 英文: 1, 數學: 2, 自然: 3 };
// The picker's four columns. 理化 is its own 科目 in the bank but the same
// column here; the last column catches whatever else a class is called
// (國文, 課輔, 社會…) so a new subject never vanishes from the form.
const SUBJ_COLS = [
  ["英文", (c) => c.subject === "英文"],
  ["數學", (c) => c.subject === "數學"],
  ["自然 / 理化", (c) => c.subject === "自然" || c.subject === "理化"],
  ["其他", (c) => !["英文", "數學", "自然", "理化"].includes(c.subject)],
];
let ROLE = null, SID = null, ALL = [], STU = null, CLASSES = [], ENROLL = [], NEW_CLASS = null;
// The three KPI tiles are filled by three independent async loads, so each one
// writes its own slot and the row is re-rendered from the collected state —
// otherwise whichever query returned last would blow away the others.
let KPI = {};

function kpi(key, o) { KPI[key] = o; renderKpis(); }
function renderKpis() {
  const order = ["tuition", "meal"];
  $("kpis").innerHTML = order.filter((k) => KPI[k]).map((k) => {
    const o = KPI[k];
    return `<div class="kpi ${o.tone || ""}"><div class="lab">${esc(o.lab)}` +
      (o.link ? `<a href="${o.link}">${esc(o.linkText || "→")}</a>` : "") + "</div>" +
      `<div class="v${o.none ? " none" : ""}">${o.v}</div>` +
      (o.sub ? `<div class="sub">${esc(o.sub)}</div>` : "") + "</div>";
  }).join("");
}

(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;
  ROLE = window.CURRENT_USER_ROLE;
  const ROLE_LABEL = { owner: "負責人", admin: "主任", teacher: "老師" };
  $("btn-signout").addEventListener("click", window.signOut);
  $("who").textContent = `${window.CURRENT_USER.email} · ${ROLE_LABEL[ROLE] || ROLE}`;

  // RLS already scopes this: a teacher's list contains only students they teach.
  // Paged, because PostgREST silently caps a bare select at 1000 rows and a
  // roster that grows past it would just lose its tail with no error.
  const [st, enr] = await Promise.all([
    fetchAll((from, to) => window.sb.from("students")
      .select("id, full_name, student_no, grade, school, active")
      .eq("active", true).order("student_no").range(from, to)),
    fetchAll((from, to) => window.sb.from("enrollments")
      .select("student_id, classes(name, subject)").eq("active", true).range(from, to)),
  ]).catch((e) => { $("pickmsg").className = "msg err"; $("pickmsg").textContent = e.message; return [null]; });
  if (!st) return;
  if (!st.length) { $("pickmsg").textContent = "沒有可檢視的學生。"; return; }

  ALL = st;
  const classesOf = {};
  (enr || []).forEach((e) => {
    if (!e.classes) return;
    (classesOf[e.student_id] ||= []).push(e.classes);
  });
  Object.values(classesOf).forEach((l) => l.sort((a, b) =>
    ((SUBJ_ORDER[a.subject] ?? 9) - (SUBJ_ORDER[b.subject] ?? 9))
    || (a.name || "").localeCompare(b.name || "", "zh-Hant")));
  st.forEach((s) => { s.classes = classesOf[s.id] || []; });

  renderGradeTabs();
  $("find").addEventListener("input", () => showList());
  $("find").addEventListener("keydown", (ev) => {
    // Enter on a single hit opens it; Escape clears the search back to the tab.
    if (ev.key === "Enter") { const m = matches(); if (m.length === 1) load(m[0].id); }
    if (ev.key === "Escape") { $("find").value = ""; showList(); }
  });
  $("btn-back").addEventListener("click", (ev) => { ev.preventDefault(); load(null); });
  $("noteAdd").onclick = addNote;
  $("btn-new").onclick = () => newStudent();

  const q = new URLSearchParams(location.search);
  const qs = q.get("id");
  if (q.get("new") === "1") { NEW_CLASS = q.get("class"); newStudent(); }
  else if (qs && st.some((s) => s.id === qs)) {
    SEL_GRADE = st.find((x) => x.id === qs).grade;
    load(qs);
  } else showList();
})();

async function fetchAll(page) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await page(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}

// ── browse: grade tabs + list ─────────────────────────────────────────────
// Tabs come from the DATA, not a literal (same rule as 班級): a grade with no
// student has no tab, and the 國小部 appears the moment a 小四 is enrolled.
let SEL_GRADE = null;
const gradesPresent = () =>
  [...new Set(ALL.map((s) => s.grade))].sort((a, b) => (a ?? 99) - (b ?? 99));

function renderGradeTabs() {
  const grades = gradesPresent();
  if (!grades.includes(SEL_GRADE)) SEL_GRADE = grades.includes(7) ? 7 : grades[0];
  const searching = $("find").value.trim() !== "";
  $("grade-tabs").innerHTML = grades.map((g) => {
    const n = ALL.filter((s) => s.grade === g).length;
    const on = !searching && SEL_GRADE === g && !SID;
    return `<button type="button" data-grade="${g ?? ""}" class="${on ? "on" : ""}">` +
      `${esc(GRADE_LABEL(g))}<span class="n">${n}</span></button>`;
  }).join("");
  $("grade-tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
    SEL_GRADE = b.dataset.grade === "" ? null : Number(b.dataset.grade);
    $("find").value = "";
    load(null);
  });
}

/** The rows the list should show right now: a search wins over the tab and
 *  crosses every grade, since the person typing a name doesn't know which
 *  年級 to look under — that was the whole complaint. */
function matches() {
  const v = $("find").value.trim().toLowerCase();
  if (v) return ALL.filter((s) =>
    (s.full_name || "").toLowerCase().includes(v) || (s.student_no || "").toLowerCase().includes(v));
  return ALL.filter((s) => s.grade === SEL_GRADE);
}

async function loadTuition() {
  if (ROLE === "teacher") { $("c-tuition").hidden = true; return; }

  const { data: rows } = await window.sb.from("tuition_outstanding_v")
    .select("class_name, term_name, expected, paid, outstanding").eq("student_id", SID);
  const { data: enr } = await window.sb.from("enrollments")
    .select("class_id").eq("student_id", SID).eq("active", true);

  if (!rows || !rows.length) {
    // No priced class at all → "—", never NT$0, which would read as "paid up".
    kpi("tuition", { lab: "本期未繳", v: "—", none: true, sub: "尚未設定班費",
                     link: "tuition.html", linkText: "收費台" });
    $("c-tuition").hidden = true;
    return;
  }
  $("c-tuition").hidden = false;
  const total = rows.reduce((a, r) => a + Number(r.outstanding || 0), 0);
  const partial = (enr || []).length > rows.length;
  kpi("tuition", {
    lab: "本期未繳", v: total <= 0 ? "已繳清" : money(total),
    tone: total <= 0 ? "good" : "due",
    sub: partial ? "⚠ 有班別尚未設定費用" : (rows[0].term_name || ""),
    link: "tuition.html", linkText: "收費台",
  });

  let html = '<table><thead><tr><th>班級</th><th class="num">應繳</th>' +
    '<th class="num">已繳</th><th class="num">未繳</th></tr></thead><tbody>' +
    rows.map((r) => `<tr><td>${esc(r.class_name)}</td><td class="num">${money(r.expected)}</td>` +
      `<td class="num">${money(r.paid)}</td>` +
      `<td class="num${Number(r.outstanding) > 0 ? " due" : ""}">${money(r.outstanding)}</td></tr>`)
      .join("") + "</tbody></table>";
  // Same trap as the parent portal: the view INNER JOINs class_fees, so a class
  // with no fee set vanishes and the total silently understates the bill.
  if (partial) html += '<div class="warnbox">有班別尚未設定本期費用，上列並非全部應繳項目。</div>';
  $("tuition").innerHTML = html;
}

const nul = (v) => { const t = (v ?? "").trim(); return t === "" ? null : t; };
const num = (v) => { const t = (v ?? "").trim(); return t === "" ? null : Number(t); };
const gradeSubjectClasses = (grade) => CLASSES
  .filter((c) => c.active && c.grade === grade && c.subject)
  .sort((a, b) => ((SUBJ_ORDER[a.subject] ?? 9) - (SUBJ_ORDER[b.subject] ?? 9))
    || (a.name || "").localeCompare(b.name || "", "zh-Hant"));
const studentClassIds = (sid) => new Set(ENROLL
  .filter((e) => e.student_id === sid && e.active).map((e) => e.class_id));

async function loadRefs() {
  if (CLASSES.length) return;
  const [c, e] = await Promise.all([
    window.sb.from("classes").select("id,name,grade,subject,active").order("name"),
    window.sb.from("enrollments").select("student_id,class_id,active"),
  ]);
  CLASSES = c.data || []; ENROLL = e.data || [];
}

/** s = the student row, or null to create one. Renders the record as editable
 *  cards in the left column. Owner/主任 edit; a teacher gets the same fields
 *  disabled, minus 家長聯絡 / 家長專區綁定 (see the contacts rule below) and
 *  minus the 儲存 bar — RLS would refuse the write anyway, the UI just says so
 *  by not offering it. */
async function renderForm(s) {
  await loadRefs();
  const canEdit = ROLE === "owner" || ROLE === "admin";
  const dis = canEdit ? "" : " disabled";
  const newCls = s ? null : CLASSES.find((c) => c.id === NEW_CLASS);
  const grade = s ? s.grade : (newCls ? newCls.grade : null);
  const subj = grade != null ? gradeSubjectClasses(grade) : [];
  const has = s ? studentClassIds(s.id) : new Set(newCls ? [newCls.id] : []);

  // 🔑 THE ONE POLICY THIS PAGE ENFORCES IN CODE. RLS would happily hand a
  // teacher 父母電話/LINE for their own students (verified with a real JWT);
  // Patty's call is that it should not. Everything else here is fenced by the DB.
  const showContacts = canEdit;

  $("form").innerHTML = `
    <div class="card">
      <h2>基本資料</h2>
      <div class="frow">
        <div class="fld"><label>姓名</label><input id="f-name"${dis} value="${esc(s?.full_name || "")}"></div>
        <div class="fld"><label>學號</label><input id="f-no"${dis} value="${esc(s?.student_no || "")}"></div>
        <div class="fld"><label>年級</label><input id="f-grade"${dis} type="number" min="0" max="12" value="${s?.grade ?? (newCls?.grade ?? "")}"></div>
        <div class="fld"><label>就讀學校</label><input id="f-school"${dis} value="${esc(s?.school || "")}"></div>
      </div>
      <div class="fld" style="margin-top:10px"><label>標註</label><textarea id="f-note"${dis} rows="2"
        placeholder="原校班級、座位…">${esc(s?.note || "")}</textarea></div>
    </div>
    ${showContacts ? `<div class="card">
      <h2>家長聯絡</h2>
      <div class="guardian">
        <span class="gh"></span><span class="gh">姓名</span><span class="gh">電話</span><span class="gh">LINE ID</span>
        <span class="glabel">父</span>
        <div class="trio">
          <input id="f-fname" placeholder="姓名" value="${esc(s?.father_name || "")}">
          <input id="f-fphone" placeholder="電話" inputmode="tel" value="${esc(s?.father_phone || "")}">
          <input id="f-fline" placeholder="LINE ID" value="${esc(s?.father_line || "")}">
        </div>
        <span class="glabel">母</span>
        <div class="trio">
          <input id="f-mname" placeholder="姓名" value="${esc(s?.mother_name || "")}">
          <input id="f-mphone" placeholder="電話" inputmode="tel" value="${esc(s?.mother_phone || "")}">
          <input id="f-mline" placeholder="LINE ID" value="${esc(s?.mother_line || "")}">
        </div>
        <span class="glabel">家裡</span>
        <input id="f-hphone" class="phone-only" placeholder="電話" inputmode="tel" value="${esc(s?.home_phone || "")}">
        <span class="filler"></span>
        <span class="glabel">其他</span>
        <input id="f-other" class="wide" placeholder="阿嬤 0912-…、緊急聯絡…" value="${esc(s?.other_contact || "")}">
      </div>
    </div>` : ""}
    <div class="card">
      <h2>修習班級${grade != null ? `（${esc(GRADE_LABEL(grade))}）` : ""}</h2>
      ${subj.length ? `<div class="subjbox">${SUBJ_COLS.map(([head, pick]) => {
        const cs = subj.filter(pick);
        return `<div class="subjcol"><span class="ch">${head}</span>` + (cs.map((c) =>
          `<label><input type="checkbox"${dis} data-subj="${c.id}" ${has.has(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")
          || '<span class="none">—</span>') + "</div>";

      : `<p class="empty">${grade != null ? "這個年級還沒有開班。" : "先填年級並儲存，再選班級。"}</p>`}
    </div>
    ${s && showContacts ? `<div class="card">
      <h2>家長專區綁定</h2>
      <div id="f-binds" class="binds"><span class="msg">讀取中…</span></div>
      <div class="bindrow">
        <button type="button" class="ghost" id="f-bind">產生家長綁定碼</button>
        <span class="msg">14 天內有效，父母各可使用一次</span>
      </div>
      <div class="bindout msg" id="f-bindout"></div>
    </div>` : ""}
    ${canEdit ? `<div class="card savebar">
      ${s ? `<button type="button" class="quiet" id="f-toggle">${s.active ? "停用學生" : "啟用學生"}</button>` : ""}
      <span class="msg" id="f-msg"></span>
      ${s ? "" : `<button type="button" class="ghost push" id="f-cancel">取消</button>`}
      <button type="button" ${s ? 'class="push"' : ""} id="f-save">${s ? "儲存" : "建立學生"}</button>
    </div>` : ""}`;

  if (!canEdit) return;
  $("f-save").onclick = () => saveStudent(s);
  const fc = $("f-cancel");
  if (fc) fc.onclick = () => load(null);
  if (s) {
    renderBinds(s);
    $("f-toggle").onclick = async () => {
      if (!confirm(s.active ? `停用 ${s.full_name}？名單上會看不到這位學生。` : `重新啟用 ${s.full_name}？`)) return;

    // 一次 (max_uses 2). 8 DIGITS since 2026-09-02 (Patty's call — readable off a
    // paper slip); the guess budget is parent_bind()'s 5/h limit, so the
    // alphabet shrinking is fine but the length must stay 8. Bytes ≥250 are
    // rejected so `% 10` is uniform — no modulo bias.
    $("f-bind").onclick = async () => {
      const digits = [];
      while (digits.length < 8) {
        const buf = new Uint8Array(16);
        crypto.getRandomValues(buf);
        for (const b of buf) if (b < 250 && digits.length < 8) digits.push(b % 10);
      }
      const code = digits.join("");
      const { error } = await window.sb.from("parent_link_codes")
        .insert({ code, student_id: s.id });
      if (error) { $("f-bindout").className = "bindout msg err"; $("f-bindout").textContent = error.message; return; }
      $("f-bindout").className = "bindout msg";
      $("f-bindout").innerHTML = `家長綁定碼：<b style="font-size:17px;letter-spacing:.2em">${code.slice(0, 4)} ${code.slice(4)}</b>` +
        `（14 天內有效，父母各可使用一次）抄給家長 → 官網「家長專區」→ LINE 登入 → 輸入此碼。`;
    };
  }
}

/** 家長專區綁定 — who can currently see this student in the LIFF, and the only
 *  way to take that away. Nothing else in the back office shows this: a family
 *  that leaves goes quiet (enrollments.active=false empties every parent view)
 *  but stays BOUND, which privacy-v2 promises is undoable on request. */
async function renderBinds(s) {
  const box = $("f-binds");
  if (!box) return;
  const { data, error } = await window.sb
    .from("parent_student")
    .select("parent_id, parents(id, full_name, line_display_name, profile_id)")
    .eq("student_id", s.id);
  if (error) { box.innerHTML = `<span class="msg err">${esc(error.message)}</span>`; return; }
  const rows = (data || []).filter((r) => r.parents);
  if (!rows.length) {
    box.innerHTML = `<span class="msg">尚未有家長綁定。按「產生家長綁定碼」發碼給家長。</span>`;
    return;
  }
  // profiles.active is what parent-login re-reads on every login, so it — not
  // the link — is what "can they still get in" actually means.
  const pids = rows.map((r) => r.parents.profile_id).filter(Boolean);
  const { data: profs } = pids.length
    ? await window.sb.from("profiles").select("id, active").in("id", pids)
    : { data: [] };
  const activeOf = new Map((profs || []).map((p) => [p.id, p.active !== false]));
  box.innerHTML = rows.map((r) => {
    const p = r.parents;
    const on = p.profile_id ? activeOf.get(p.profile_id) !== false : true;
    return `<div class="b" data-pid="${esc(p.id)}">
      <span class="who">${esc(p.full_name || p.line_display_name || "（未具名家長）")}</span>
      ${p.line_display_name && p.full_name ? `<span class="line">LINE：${esc(p.line_display_name)}</span>` : ""}
      ${on ? "" : `<span class="off">帳號已停用</span>`}
      <button type="button" class="quiet" data-unbind>解除綁定</button>
    </div>`;
  }).join("");

  box.querySelectorAll("[data-unbind]").forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest(".b");
      const who = row.querySelector(".who").textContent;
      // Spell out both side effects — the consent record surviving is a
      // deliberate 個資法 decision (Patty, 2026-08-23), not an oversight, and
      // the reader of this dialog is the person who has to defend it.
      if (!confirm(
        `解除「${who}」與 ${s.full_name} 的綁定？\n\n` +
        `・家長立刻看不到這個孩子的任何資料\n` +
        `・若這是他綁定的最後一個孩子，帳號會一併停用\n` +
        `・同意紀錄會保留（證明當初有取得同意），不會刪除\n\n` +
        `之後要恢復，重新發一次綁定碼即可。`)) return;
      btn.disabled = true;
      const { data, error } = await window.sb.rpc("parent_unbind", {
        p_parent_id: row.dataset.pid, p_student_id: s.id,
      });
      if (error || !data?.ok) {
        btn.disabled = false;
        $("f-bindout").className = "bindout msg err";
        $("f-bindout").textContent = "解除失敗：" + (error?.message || data?.error || "unknown");
        return;
      }
      $("f-bindout").className = "bindout msg";
      $("f-bindout").textContent = `已解除「${who}」的綁定。` +
        (data.deactivated ? "這是他的最後一個孩子，帳號已停用。" : "") +
        (data.codes_expired ? `　這位學生已無綁定家長，${data.codes_expired} 組未使用的綁定碼一併失效。` : "") +
        "　同意紀錄保留。";
      await renderBinds(s);
    };
  });
}

async function saveStudent(s) {
  const m = $("f-msg");
  m.className = "msg";
  const v = (id) => { const el = $(id); return el ? nul(el.value) : undefined; };
  const fields = {
    full_name: v("f-name"), student_no: v("f-no"),
    school: v("f-school"), grade: num($("f-grade").value),
    father_name: v("f-fname"), father_phone: v("f-fphone"), father_line: v("f-fline"),
    mother_name: v("f-mname"), mother_phone: v("f-mphone"), mother_line: v("f-mline"),
    home_phone: v("f-hphone"), other_contact: v("f-other"),
    note: v("f-note"),
  };
  Object.keys(fields).forEach((k) => { if (fields[k] === undefined) delete fields[k]; });
  if (!fields.full_name) { m.className = "msg err"; m.textContent = "請輸入學生姓名"; return; }
  try {
    let id = s ? s.id : null;
    if (s) {
      const { error } = await window.sb.from("students").update(fields).eq("id", s.id);
      if (error) throw error;
    } else {
      const { data, error } = await window.sb.from("students").insert(fields).select("id").single();
      if (error) throw error;
      id = data.id;
    }
    await syncSubjects(id);
    CLASSES = []; ENROLL = [];            // force a refetch so chips reflect the save
    if (!s) { location.href = `student.html?id=${id}`; return; }
    // Stay put: refresh the roster row (name/grade may have changed) and the page.
    const { data: row } = await window.sb.from("students")
      .select("id, full_name, student_no, grade, school, active").eq("id", id).single();
    const i = ALL.findIndex((x) => x.id === id);
    if (row && i >= 0) ALL[i] = { ...ALL[i], ...row };
    await load(id);
    const fm = $("f-msg");
    if (fm) { fm.className = "msg ok"; fm.textContent = "已儲存 ✓"; }
  } catch (e) {
    m.className = "msg err"; m.textContent = e.message || String(e);
  }
}

/** Ported verbatim from 名冊: if the checkbox block was never rendered (a grade
 *  with no active classes), an empty `want` would unenroll the student from
 *  everything — bail instead. Unchecking every rendered box still unenrolls;
 *  that one is deliberate.
 *
 *  The box only ever renders the student's OWN grade (gradeSubjectClasses), so
 *  `del` must be scoped to what was rendered. Otherwise saving this form wipes
 *  every cross-grade enrollment — the 國一 who sits 國二數A, the 小六 in 國一英B.
 *  That was unreachable while everyone sat only in their own grade; it stopped
 *  being so on 2026-08-26 when the real 名單 put 9 students across grades.
 *  Consequence: a cross-grade enrollment cannot be REMOVED here either. Silently
 *  losing one is the worse failure. */
async function syncSubjects(studentId) {
  const boxes = [...document.querySelectorAll("[data-subj]")];
  if (!boxes.length) return;
  const want = new Set(boxes.filter((b) => b.checked).map((b) => b.dataset.subj));
  const rendered = new Set(boxes.map((b) => b.dataset.subj));
  const have = studentClassIds(studentId);
  for (const id of want) {
    if (!have.has(id)) {
      const { error } = await window.sb.from("enrollments")
        .upsert({ student_id: studentId, class_id: id, active: true },
                { onConflict: "student_id,class_id" });
      if (error) throw error;
    }
  }
  const del = [...have].filter((id) => rendered.has(id) && !want.has(id));
  if (del.length) {
    const { error } = await window.sb.from("enrollments")
      .delete().eq("student_id", studentId).in("class_id", del);
    if (error) throw error;
  }
}

async function loadNotes() {
  if (ROLE === "teacher") { $("c-notes").hidden = true; return; }
  $("c-notes").hidden = false;
  const { data, error } = await window.sb.from("student_notes")
    .select("id, body, created_at").eq("student_id", SID)
    .order("created_at", { ascending: false });
  if (error) { $("notes").innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  $("notes").innerHTML = (data || []).map((n) =>
    `<div class="note"><span class="when">${esc(String(n.created_at).slice(0, 10))}</span>` +
    `<span class="body">${esc(n.body)}</span>` +
    `<button class="danger" type="button" data-del="${n.id}">刪除</button></div>`).join("")
    || '<p class="empty">還沒有備註。</p>';
  $("notes").onclick = async (ev) => {
    const id = ev.target?.dataset?.del;
    if (!id || !confirm("刪除這則備註？（會留下稽核紀錄）")) return;
    const { error } = await window.sb.from("student_notes").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    loadNotes();
  };
}

async function addNote() {
  const body = $("noteBody").value.trim();
  const m = $("notemsg");
  m.className = "msg";
  if (!body) { m.className = "msg err"; m.textContent = "請先輸入內容。"; return; }
  const { error } = await window.sb.from("student_notes").insert({ student_id: SID, body });
  if (error) { m.className = "msg err"; m.textContent = error.message; return; }
  $("noteBody").value = "";
  m.textContent = "";
  loadNotes();
}
</script>
