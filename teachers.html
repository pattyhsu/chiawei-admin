<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家偉補習班 · 老師帳號</title>
<!-- 老師帳號 — 建立登入、指派任教班級、停用離職帳號.
     Hand-written, following roster.html. Moved here from the 出題台 app
     (/app/teachers) on 2026-08-05; that page and its /api/staff/teachers route
     were deleted in the same change — one surface, no drift.

     ⚠️ THIS PAGE MINTS CREDENTIALS. That is a step beyond what roster.html does,
     and it is worth being clear about what protects it:

       * 停用/啟用, rename, 指派班級 are PLAIN TABLE WRITES under RLS + column
         grants — `grant update (active, full_name) on profiles` and
         `grant insert, delete on class_teachers`, owner/admin policies only
         (migrations 20260728000002 + 20260805000002, pgTAP 10 + 14).
       * profiles.role is granted to NOBODY. No client, owner included, can
         promote anyone. That is the ceiling the whole role system rests on.
       * profiles has no INSERT or DELETE grant either — accounts are created by
         the `teacher-create` Edge Function (which holds service_role server-side
         and hard-codes role='teacher'), and are never deleted, only 停用.
       * 改帳號/改密碼 (added 2026-08-22) are the `teacher-credentials` function,
         the second service_role holder. Neither is a table write a browser can
         do: a password lives in GoTrue, and `profiles.username` is granted to
         nobody. An OWNER ROW IS NOT A LEGAL TARGET there — a 主任 may rotate a
         老師, only the 負責人 may rotate a 主任, and nobody rotates the 負責人
         through this page. Both functions refuse to touch `profiles.role`.
       * every write lands an audit row via a security-definer trigger, with the
         signed-in owner as the actor.

     The password is shown ONCE and is never stored anywhere — not in the
     database, not in the audit row, not in this page's state after dismiss.
     That holds whether it was generated or typed here: the field is cleared on
     success, so dismissing the panel really is the last copy.

     Load order is load-bearing: auth.js hides <body> at parse time and the boot
     block must not run until authGate() reaches a verdict. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>window.PAGE_ROLES = ["owner", "admin"];</script>
<script src="auth.js"></script>
<style>
:root {
  /* Brand palette (chiawei CLAUDE.md): 寶藍 primary, 黃/橘 accents.
     Copied per-page, matching roster.html — this repo has no shared stylesheet. */
  --brand: #2547c7;
  --brand-yellow: #f8c414;
  --brand-orange: #ef5226;
  --bg: #f6f7fb;
  --surface: #fff;
  --ink: #1b1f2a;
  --muted: #6b7280;
  --line: #e3e6ee;
  --danger: #c0362c;
  --ok: #1e7d46;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: "PingFang TC", "Noto Sans TC", system-ui, -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 2px solid var(--brand);
  position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
}
header .brand { font-weight: 700; color: var(--brand); }
header .spacer { flex: 1; }
header .who { font-size: 13px; color: var(--muted); }
header a.home { font-size: 13px; color: var(--muted); text-decoration: none; }
header a.home:hover { color: var(--brand); }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }

button {
  font: inherit; font-size: 14px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); padding: 7px 13px;
}
button:hover { border-color: var(--brand); }
button.primary {
  background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600;
}
button.primary:hover { filter: brightness(1.08); }
button.small { font-size: 13px; padding: 4px 10px; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }

input, select {
  font: inherit; font-size: 14px; width: 100%;
  padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; color: var(--ink);
}
input:focus, select:focus { outline: 2px solid var(--brand); border-color: transparent; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.fld { margin-bottom: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
/* At phone width two-up squeezes a 12-character password into ~90px, and the
   帳號密碼 panel is exactly the field you must be able to read back. */
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

.pane {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
}
.pane h2 {
  font-size: 14px; color: var(--brand); margin: 0 0 10px;
  display: flex; align-items: center; gap: 8px;
}
.pane h2 .spacer { flex: 1; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.7; }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
/* An explicit `display` beats the UA sheet's [hidden]{display:none}, so the
   collapsed 已停用 list would render regardless of its hidden attribute. */
[hidden] { display: none !important; }
ul.list li {
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
ul.list li.off { opacity: .55; }
.rowmain { flex: 1; min-width: 180px; }
.rowname { font-weight: 600; font-size: 14px; }
.rowmeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pill {
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: #fff6e0; color: #9a6b00; font-weight: 700;
}
.empty { font-size: 13px; color: var(--muted); padding: 8px 2px; }
.err {
  background: #fdecea; border: 1px solid #f5c2bd; color: var(--danger);
  border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px;
}
/* Both banners are scrolled to, and `header` is sticky — without this they land
   underneath it and the page looks like it did nothing. */
.err, .issued { scroll-margin-top: 70px; }

/* A refusal inside a row panel belongs IN that panel. The top banner is 800px
   away once the list has 25 accounts, which is exactly how a 7-character
   password looked like "nothing happened" on 2026-08-23. */
.credmsg {
  color: var(--danger); font-size: 13px; font-weight: 600;
  margin: 0 0 10px;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* the one-time password panel — wording carried over from the 出題台 page it replaces */
.issued {
  background: #eef1fc; border: 1px solid var(--brand);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}
.issued strong { display: block; font-size: 14px; margin-bottom: 6px; }
.issued code {
  font-size: 18px; font-weight: 700; letter-spacing: .04em;
  background: #fff; border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; display: inline-block; margin: 2px 0 8px;
  user-select: all;
}
.issued p { margin: 0 0 8px; font-size: 13px; }
.issued .warn { color: var(--danger); font-weight: 600; }

/* the two inline row panels — 指派班級 and 帳號密碼. Both drop below the row
   they belong to rather than opening a modal, so the list never loses its place. */
.classpick, .credpick {
  flex-basis: 100%; margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--line);
}
.classpick .grid { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; }
.classpick label {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink); font-weight: 400; margin: 0;
}
.classpick input { width: auto; }
.credpick .hint { margin: -4px 0 10px; }

/* password field + its 產生 button. The input is type=text on purpose: nobody
   is typing their OWN password here — a 主任 is reading one out to a teacher,
   and dots would only invite a typo neither of them can see. */
.pwline { display: flex; gap: 8px; }
.pwline button { flex: 0 0 auto; }
</style>
</head>
<body>
<header>
  <span class="brand">家偉補習班 · 老師帳號</span>
  <a class="home" href="index.html">← 管理後台</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button type="button" id="btn-signout">登出</button>
</header>

<main>
  <div id="err" class="err" style="display:none"></div>

  <p class="hint" style="margin-top:0">
    建立老師登入、指派任教班級、停用離職帳號。班級與學生名冊在
    <a href="classes.html">班級</a>。老師只看得到自己任教班級的學生與成績。
    帳號一律<strong>停用</strong>而不刪除，過去出過的卷和批改紀錄才留得住。
  </p>

  <div id="issued"></div>

  <section class="pane">
    <h2>＋ 新增老師帳號 <span class="spacer"></span>
      <button type="button" id="btn-toggle-new" class="small">展開</button>
    </h2>
    <div id="newform" style="display:none">
      <div class="row2">
        <div class="fld">
          <label for="f-username">帳號 Username</label>
          <input id="f-username" type="text" placeholder="wang" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="fld">
          <label for="f-fullname">姓名</label>
          <input id="f-fullname" type="text" placeholder="王老師" autocomplete="off">
        </div>
      </div>
      <div class="fld">
        <label for="f-password">密碼</label>
        <div class="pwline">
          <input id="f-password" type="text" placeholder="留空＝系統自動產生"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button type="button" class="small" data-gen="f-password">產生</button>
        </div>
      </div>
      <p class="hint" style="margin-top:0">
        帳號只能用英文小寫、數字、<code>. _ -</code>（2–32 字）。
        登入時只要輸入帳號，不用打 <code>@chiawei.local</code>。
        密碼可以自己打（至少 6 個字）、按<strong>產生</strong>、或留空讓系統產生，
        建立後<strong>只會顯示一次</strong>。
      </p>
      <div class="actions" style="margin-top:10px">
        <button type="button" id="btn-create" class="primary">建立帳號</button>
      </div>
    </div>
  </section>

  <section class="pane">
    <h2>帳號列表</h2>
    <ul class="list" id="stafflist"></ul>
    <!-- 停用'd accounts collapse in here. They can never be deleted (past 卷 and
         批改紀錄 reference them), so without this the list only ever grows. -->
    <div id="offwrap" hidden>
      <button type="button" class="small" id="btn-offtoggle"></button>
      <ul class="list" id="offlist" hidden style="margin-top:10px"></ul>
    </div>
  </section>
</main>

<script>
// ── helpers (same shape as roster.html) ─────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Error codes the teacher-create function can return. Carried over from the
// 出題台 page's ERROR_LABEL, plus the ones it never mapped.
const ERROR_LABEL = {
  bad_username: "帳號只能用英文小寫、數字、. _ -（2–32 字）",
  username_taken: "這個帳號已經有人用了",
  auth_create_failed: "建立登入失敗（帳號可能已存在於登入系統）",
  profile_create_failed: "建立帳號資料失敗，請再試一次",
  rate_limited: "次數過於頻繁，請稍後再試",
  forbidden: "只有負責人／主任可以做這個動作",
  deactivated: "你的帳號已停用",
  unauthenticated: "登入已過期，請重新登入",
  bad_request: "欄位不完整",
  // teacher-credentials
  bad_password: "密碼至少 6 個字，前後不能有空白",
  password_is_username: "密碼不能和帳號一樣",
  no_such_account: "找不到這個帳號",
  owner_protected: "負責人的帳號不能從這裡改，請用 Supabase 後台",
  forbidden_target: "只有負責人可以改主任的帳號密碼",
  password_update_failed: "改密碼失敗，請再試一次",
  username_update_failed: "改帳號失敗，請再試一次",
};

function fail(e) {
  const box = $("err");
  // Surface the DB's own message: with RLS as the boundary, a refusal here is
  // information (42501 = the policy said no), not noise to swallow.
  const code = e && e.code;
  box.textContent = "操作失敗：" + (ERROR_LABEL[code] || e?.message || e);
  box.style.display = "";
  box.scrollIntoView({ block: "nearest" });
}
// No auto-hide: an error that erases itself after 8 seconds is an error the
// 主任 can miss entirely, and then the page is just lying about what happened.
// Every write path calls clearErr() before it starts, which is what retires it.
const clearErr = () => ($("err").style.display = "none");

const ROLE_LABEL = { owner: "負責人", admin: "主任", teacher: "老師" };

// ── state ───────────────────────────────────────────────────────────────────
let STAFF = [], CLASSES = [], ASSIGN = [];
let editing = null;      // profile id whose 指派班級 grid is open
let draftClasses = [];   // checkbox state while editing
let credEditing = null;  // profile id whose 帳號密碼 panel is open

// The two panels are mutually exclusive: render() rebuilds the whole list, and
// a half-typed password in a row that just got re-rendered is a password lost.
const closePanels = () => { editing = null; credEditing = null; };

// A password a 主任 reads aloud and a teacher types, so: lowercase + digits
// only, minus the four characters that get misheard or mistyped (l/1, o/0).
// The alphabet is exactly 32 long, which divides 256 — so `% length` carries no
// modulo bias and every character really is 5 uniform bits. 12 chars ≈ 60 bits.
const PW_ALPHABET = "abcdefghijkmnpqrstuvwxyz23456789";
// 6, Patty 2026-08-23. Also GoTrue's own configured floor, so it is the lowest
// value that can work at all — below it the auth service refuses on its own, and
// the 主任 would get a 502 instead of this page's plain sentence.
const PW_MIN = 6;   // must match teacher-create / teacher-credentials
function genPassword(len = 12) {
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes, (b) => PW_ALPHABET[b % PW_ALPHABET.length]).join("");
}

// Who this page may hand new credentials to. The Edge Function enforces the
// same rule server-side — this only decides whether the button is drawn.
// Never an owner row (not even your own), and a 主任 row is 負責人-only.
function mayEditCred(r) {
  if (r.id === window.CURRENT_USER.id) return false;
  if (r.role === "teacher") return true;
  return r.role === "admin" && window.CURRENT_USER_ROLE === "owner";
}

async function loadAll() {
  const [prof, cls, asg] = await Promise.all([
    window.sb.from("profiles").select("id,username,full_name,role,active")
      .in("role", ["owner", "admin", "teacher"]).order("role").order("username"),
    window.sb.from("classes").select("id,name,grade,subject").eq("active", true).order("name"),
    window.sb.from("class_teachers").select("profile_id,class_id"),
  ]);
  for (const r of [prof, cls, asg]) if (r.error) throw r.error;
  STAFF = prof.data; CLASSES = cls.data; ASSIGN = asg.data;
}

const classesOf = (pid) => ASSIGN.filter((a) => a.profile_id === pid).map((a) => a.class_id);
const className = (cid) => (CLASSES.find((c) => c.id === cid) || {}).name || "（已停用班級）";

function render() {
  const ul = $("stafflist");
  if (!STAFF.length) { ul.innerHTML = '<li class="empty">還沒有帳號。</li>'; return; }

  // Active accounts are the list; 停用'd ones collapse below it. Deactivating is
  // the only way to retire an account (papers/exams reference the profile), so
  // the retired ones accumulate forever and must not crowd the working list.
  const live = STAFF.filter((r) => r.active);
  const off = STAFF.filter((r) => !r.active);
  ul.innerHTML = rowsHtml(live) || '<li class="empty">沒有啟用中的帳號。</li>';
  $("offwrap").hidden = !off.length;
  if (off.length) {
    $("offlist").innerHTML = rowsHtml(off);
    const shown = !$("offlist").hidden;
    $("btn-offtoggle").textContent = `已停用帳號（${off.length}）${shown ? " ▲" : " ▼"}`;
  }
  hookRows($("stafflist"));
  hookRows($("offlist"));
}

function rowsHtml(rows) {
  return rows.map((r) => {
    const mine = classesOf(r.id);
    const isTeacher = r.role === "teacher";
    const meta = [esc(r.username || "—"), ROLE_LABEL[r.role] || esc(r.role)];
    if (isTeacher) meta.push(mine.length ? mine.map((c) => esc(className(c))).join("、") : "尚未指派班級");

    const credpanel = credEditing === r.id ? `
      <div class="credpick">
        <div class="row2">
          <div class="fld">
            <label>帳號 Username</label>
            <input type="text" data-cred-user value="${esc(r.username || "")}"
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   data-1p-ignore data-lpignore="true">
          </div>
          <div class="fld">
            <label>新密碼</label>
            <div class="pwline">
              <!-- autocomplete="new-password" is the one value Chrome actually
                   honours here. A bare "off" is ignored, and a text input sat
                   beside a username field is exactly the shape its heuristics
                   fill — which would quietly propose the USERNAME as the
                   password. saveCred() refuses that pairing regardless. -->
              <input type="text" data-cred-pw placeholder="留空＝不改密碼"
                     autocomplete="new-password" autocapitalize="off" spellcheck="false"
                     data-1p-ignore data-lpignore="true">
              <button type="button" class="small" data-gen-cred="1">產生</button>
            </div>
          </div>
        </div>
        <p class="hint">
          改帳號後，他要用<strong>新帳號</strong>登入；密碼留空就不動。
          新密碼至少 <strong>6 個字</strong>、不能和帳號一樣，一樣<strong>只會顯示一次</strong>。
        </p>
        <p class="credmsg" hidden></p>
        <div class="actions">
          <button type="button" class="primary small" data-credsave="${esc(r.id)}">儲存</button>
          <button type="button" class="small" data-cancel="1">取消</button>
        </div>
      </div>` : "";

    const picker = editing === r.id ? `
      <div class="classpick">
        <div class="grid">${
          CLASSES.length
            ? CLASSES.map((c) => `<label><input type="checkbox" data-cls="${esc(c.id)}"${
                draftClasses.includes(c.id) ? " checked" : ""}> ${esc(c.name)}</label>`).join("")
            : '<span class="empty">還沒有班級。請先到<a href="classes.html">班級</a>建立班級。</span>'
        }</div>
        <div class="actions">
          <button type="button" class="primary small" data-save="${esc(r.id)}">儲存</button>
          <button type="button" class="small" data-cancel="1">取消</button>
        </div>
      </div>` : "";

    return `<li class="${r.active ? "" : "off"}">
      <div class="rowmain">
        <div class="rowname">${esc(r.full_name || "—")}${
          r.active ? "" : ' <span class="pill">已停用</span>'}</div>
        <div class="rowmeta">${meta.join(" · ")}</div>
      </div>
      <div class="actions">
        ${isTeacher && editing !== r.id
            ? `<button type="button" class="small" data-assign="${esc(r.id)}">指派班級</button>` : ""}
        ${mayEditCred(r) && credEditing !== r.id
            ? `<button type="button" class="small" data-cred="${esc(r.id)}">帳號密碼</button>` : ""}
        ${r.id !== window.CURRENT_USER.id
            ? `<button type="button" class="small ${r.active ? "danger" : ""}" data-active="${esc(r.id)}" data-to="${r.active ? "0" : "1"}">${r.active ? "停用" : "啟用"}</button>` : ""}
      </div>
      ${picker}
      ${credpanel}
    </li>`;
  }).join("");
}

// Own row has no 停用 button — that is a self-lockout guard, not a rule about
// owners. An owner MAY retire another owner (profiles_upd_staff allows it: a
// 主任 cannot touch an owner row, but an owner can), which is how a handover
// happens; the button used to be hidden on every owner row, so the only way to
// do it was SQL.
function hookRows(ul) {
  ul.querySelectorAll("[data-assign]").forEach((el) => el.addEventListener("click", () => {
    closePanels(); editing = el.dataset.assign; draftClasses = classesOf(editing); render();
  }));
  ul.querySelectorAll("[data-cred]").forEach((el) => el.addEventListener("click", () => {
    closePanels(); credEditing = el.dataset.cred; render();
  }));
  ul.querySelectorAll("[data-cancel]").forEach((el) => el.addEventListener("click", () => {
    closePanels(); render();
  }));
  // Fill the field rather than replacing it: the 主任 can still overwrite what
  // 產生 produced, and nothing about the row re-renders (which would wipe it).
  ul.querySelectorAll("[data-gen-cred]").forEach((el) => el.addEventListener("click", () => {
    const input = el.closest(".pwline").querySelector("[data-cred-pw]");
    input.value = genPassword(); input.focus(); input.select();
  }));
  ul.querySelectorAll("[data-cls]").forEach((el) => el.addEventListener("change", () => {
    const id = el.dataset.cls;
    draftClasses = el.checked ? [...draftClasses, id] : draftClasses.filter((x) => x !== id);
  }));
  ul.querySelectorAll("[data-save]").forEach((el) => el.addEventListener("click", () => saveClasses(el.dataset.save)));
  ul.querySelectorAll("[data-credsave]").forEach((el) => el.addEventListener("click", () => saveCred(el, el.dataset.credsave)));
  ul.querySelectorAll("[data-active]").forEach((el) => el.addEventListener("click", () =>
    setActive(el.dataset.active, el.dataset.to === "1")));
}

async function refresh() { await loadAll(); render(); }

// ── writes ──────────────────────────────────────────────────────────────────

// Diff, don't delete-then-insert: a full replace briefly leaves the teacher with
// no classes, and every removal/addition is separately audited by the trigger.
async function saveClasses(pid) {
  clearErr();
  try {
    const have = classesOf(pid);
    const add = draftClasses.filter((c) => !have.includes(c));
    const del = have.filter((c) => !draftClasses.includes(c));
    if (del.length) {
      const { error } = await window.sb.from("class_teachers")
        .delete().eq("profile_id", pid).in("class_id", del);
      if (error) throw error;
    }
    if (add.length) {
      const { error } = await window.sb.from("class_teachers")
        .insert(add.map((class_id) => ({ profile_id: pid, class_id })));
      if (error) throw error;
    }
    editing = null;
    await refresh();
  } catch (e) { fail(e); }
}

async function setActive(pid, active) {
  clearErr();
  const who = STAFF.find((s) => s.id === pid);
  if (!active && !confirm(`確定停用「${who?.full_name || who?.username}」？\n\n他將無法再登入，但過去的卷與批改紀錄都會保留。`)) return;
  try {
    // RLS denies a non-owner silently (0 rows, no error), so re-read and check
    // rather than trusting the absence of an error.
    const { error } = await window.sb.from("profiles").update({ active }).eq("id", pid);
    if (error) throw error;
    await refresh();
    const now = STAFF.find((s) => s.id === pid);
    if (now && now.active !== active) throw { message: "沒有權限變更這個帳號" };
  } catch (e) { fail(e); }
}

// The only two non-PostgREST calls on this site. Minting a login and rotating
// one both need the Auth Admin API (service_role), so they live in Edge
// Functions; supabase-js attaches the signed-in session's JWT, which each
// function re-checks against profiles.role before doing anything.
async function invokeFn(name, body) {
  const { data, error } = await window.sb.functions.invoke(name, { body });
  // A non-2xx from an Edge Function arrives as FunctionsHttpError with the body
  // on error.context — dig the code out so ERROR_LABEL can speak.
  if (error) {
    let code = null;
    try { code = (await error.context?.json())?.error; } catch { /* no JSON body */ }
    throw { code, message: error.message };
  }
  if (!data || !data.ok) throw { code: data?.error };
  return data;
}

async function createTeacher() {
  clearErr();
  const username = $("f-username").value.trim().toLowerCase();
  const full_name = $("f-fullname").value.trim();
  const password = $("f-password").value;
  if (!username || !full_name) return fail({ code: "bad_request" });
  // Checked here as well as in the function so the 主任 hears about a 3-letter
  // password before the round trip, not after.
  if (password && (password.length < PW_MIN || password.trim() !== password)) {
    return fail({ code: "bad_password" });
  }
  if (password && password.toLowerCase() === username) return fail({ code: "password_is_username" });

  const btn = $("btn-create");
  btn.disabled = true; btn.textContent = "建立中…";
  try {
    // An empty password field means "you pick one" — the function generates.
    const data = await invokeFn("teacher-create", { username, full_name, password });
    showIssued(data.username, data.password, "created");
    $("f-username").value = ""; $("f-fullname").value = ""; $("f-password").value = "";
    $("newform").style.display = "none"; $("btn-toggle-new").textContent = "展開";
    await refresh();
  } catch (e) {
    fail(e);
  } finally {
    btn.disabled = false; btn.textContent = "建立帳號";
  }
}

// 改帳號 / 改密碼. Either half may be a no-op; both together are two calls, and
// the rename goes FIRST so that if the password call then fails, the account is
// simply unchanged-but-renamed rather than holding a password shown under a
// username that no longer exists.
async function saveCred(btn, pid) {
  clearErr();
  const panel = btn.closest(".credpick");
  const msg = panel.querySelector(".credmsg");
  // The panel reports its own refusals. The top banner is 800px away once the
  // list has 25 accounts, which is how a 7-character password on 2026-08-23
  // looked to Patty like the button did nothing at all.
  const say = (code) => {
    msg.textContent = ERROR_LABEL[code] || code;
    msg.hidden = false;
    msg.scrollIntoView({ block: "nearest" });
  };
  msg.hidden = true;

  const uname = panel.querySelector("[data-cred-user]").value.trim().toLowerCase();
  const pw = panel.querySelector("[data-cred-pw]").value;
  const who = STAFF.find((s) => s.id === pid) || {};
  const label = who.full_name || who.username || "";

  if (!uname) return say("bad_username");
  if (pw && (pw.length < PW_MIN || pw.trim() !== pw)) return say("bad_password");
  // Chrome's autofill will happily put the username in the password box, and a
  // password equal to the login is worth refusing on its own merits anyway.
  if (pw && pw.toLowerCase() === uname) return say("password_is_username");
  const renaming = uname !== String(who.username || "").toLowerCase();
  if (!renaming && !pw) { closePanels(); return render(); }

  if (renaming && !confirm(
    `確定把「${label}」的帳號從 ${who.username} 改成 ${uname}？\n\n` +
    `他下次要用「${uname}」登入，舊帳號就不能用了。`)) return;

  btn.disabled = true; btn.textContent = "儲存中…";
  try {
    if (renaming) await invokeFn("teacher-credentials", { action: "username", id: pid, username: uname });
    const issued = pw
      ? await invokeFn("teacher-credentials", { action: "password", id: pid, password: pw })
      : null;
    closePanels();
    await refresh();
    if (issued) showIssued(issued.username, issued.password, "changed");
  } catch (e) {
    btn.disabled = false; btn.textContent = "儲存";
    say(e?.code || e?.message || e);
    // A failed rename leaves the panel open with what was typed still in it, so
    // the 主任 can fix the name and retry without re-typing the password.
    await loadAll();
  }
}

// The password exists in exactly one place: this panel. Nothing writes it to the
// database, the audit row, or storage — dismissing it destroys the only copy.
// (Since 改密碼 exists, losing it is no longer terminal: it costs another
// rotation rather than a dead account. The warning stays firm anyway.)
function showIssued(username, password, mode) {
  $("issued").innerHTML = `
    <div class="issued">
      <strong>${mode === "changed" ? "已更新" : "已建立"} ${esc(username)}</strong>
      <p>密碼：<code>${esc(password)}</code></p>
      <p class="warn">這組密碼只會顯示這一次，系統不會保存。</p>
      <p class="hint" style="margin-bottom:10px">
        請現在交給老師，關掉之後就看不到了。若遺失，可以回來按<strong>帳號密碼</strong>再改一次。
      </p>
      <button type="button" id="btn-dismiss" class="small">我已抄下來</button>
    </div>`;
  $("btn-dismiss").addEventListener("click", () => ($("issued").innerHTML = ""));
  $("issued").scrollIntoView({ block: "nearest" });
}

// ── boot ────────────────────────────────────────────────────────────────────
(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;            // gate already redirected
  $("btn-signout").addEventListener("click", window.signOut);
  $("who").textContent = `${window.CURRENT_USER.email} · ${window.CURRENT_USER_ROLE}`;
  $("btn-toggle-new").addEventListener("click", () => {
    const open = $("newform").style.display !== "none";
    $("newform").style.display = open ? "none" : "";
    $("btn-toggle-new").textContent = open ? "展開" : "收合";
    if (!open) $("f-username").focus();
  });
  $("btn-create").addEventListener("click", createTeacher);
  document.querySelectorAll("[data-gen]").forEach((el) => el.addEventListener("click", () => {
    const input = $(el.dataset.gen);
    input.value = genPassword(); input.focus(); input.select();
  }));
  $("btn-offtoggle").addEventListener("click", () => {
    $("offlist").hidden = !$("offlist").hidden;
    render();
  });
  try { await refresh(); } catch (e) { fail(e); }
})();
</script>
</body>
</html>
